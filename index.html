<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a1e">
<meta name="description" content="代码渡劫模拟器 · C语言天劫实录 —— 单文件文字冒险，报错图鉴 × 知识点 × 隐藏结局">
<title>代码渡劫模拟器 · C语言天劫实录</title>
<style>
/* =====================================================================
   《代码渡劫模拟器》参赛最终版 · 星庭主题
   配色参考「天逸 · 星庭」：宝蓝丝绒 × 冰蓝 × 白蕾丝 × 深空星野
   —— 深空藏蓝打底，宝蓝为主色族，冰蓝/珍珠白做强调，
      金琥珀只留给「功德」，语义色（成功/警告/报错）独立成系。
   ===================================================================== */
:root{
  --bg:#050a1e;            /* 深空夜蓝 */
  --bg2:#0a1230;
  --card:#0c1531;          /* 宝蓝丝绒面板 */
  --card2:#121d42;
  --line:#25366e;          /* 宝蓝描边 */
  --line2:#31459022;
  --ink:#eaf0ff;           /* 珍珠白正文 */
  --dim:#8fa0d4;           /* 冰蓝灰辅助字 */
  --royal:#4d6bfe;         /* 宝蓝主色 */
  --ice:#9fd4ff;           /* 冰蓝强调 */
  --gold:#ffd479;          /* 功德琥珀 */
  --violet:#b9a5ff;        /* 星紫点缀 */
  --ok:#6fe7c8; --warn:#ffd479; --bad:#ff7b9c;
  --r:14px; --pad:16px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scrollbar-color:#31459e #070d24;scrollbar-width:thin}
body{
  min-height:100vh;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1000px 560px at 14% -10%, #16255f 0%, transparent 62%),
    radial-gradient(820px 520px at 106% 8%, #0e2f56 0%, transparent 58%),
    radial-gradient(700px 700px at 50% 118%, #101c4a 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
  display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom);
}
/* 滚动条也穿星庭制服 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#070d24}
::-webkit-scrollbar-thumb{background:#2b3d85;border-radius:99px;border:2px solid #070d24}
::-webkit-scrollbar-thumb:hover{background:#4d6bfe}

/* ---------- 星空画布（Canvas 星野，装饰层，不拦截任何点击） ---------- */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#wrap{position:relative;z-index:1;width:100%;max-width:680px;min-height:100vh;
  display:flex;flex-direction:column;padding:0 var(--pad)}

/* ---------- 开场加载动画 ---------- */
#boot{position:fixed;inset:0;z-index:100;background:
    radial-gradient(900px 520px at 50% 18%, #131f52 0%, transparent 65%),var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .5s ease;padding:20px;text-align:center}
#boot.off{opacity:0;pointer-events:none}
#boot .bava{width:96px;height:96px;border-radius:50%;overflow:hidden;
  border:2px solid var(--ice);box-shadow:0 0 0 5px #9fd4ff22,0 0 34px #4d6bfe88;
  animation:breathe 2.4s ease-in-out infinite}
#boot .bava img{width:100%;height:100%;display:block}
@keyframes breathe{0%,100%{box-shadow:0 0 0 5px #9fd4ff22,0 0 26px #4d6bfe66}50%{box-shadow:0 0 0 8px #9fd4ff33,0 0 44px #4d6bfeaa}}
#boot h1{margin:0;font-size:22px;letter-spacing:4px;font-weight:800;
  font-family:Palatino,"Songti SC","Noto Serif SC",Georgia,serif;
  background:linear-gradient(92deg,var(--ice),#fff 45%,var(--royal));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#boot .bterm{width:min(340px,86vw);text-align:left;background:#060b22;border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;font-family:var(--mono);font-size:12px;line-height:1.9;color:var(--ice)}
#boot .bterm .p{color:var(--dim)}
#boot .bterm .ok{color:var(--ok)}
#boot .bbar{height:5px;border-radius:99px;background:#0a1130;border:1px solid var(--line);overflow:hidden;margin-top:7px}
#boot .bbar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--royal),var(--ice));transition:width .3s ease}
#boot .skip{font-size:11px;color:var(--dim);letter-spacing:1px}

/* ---------- 顶栏（常驻：音效开关 / 图鉴 / 局内工具） ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:8px 0;background:#050a1ef2;border-bottom:1px solid #1a2450;backdrop-filter:blur(6px)}
.topbar .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.topbar .ava{width:30px;height:30px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  border:1.5px solid var(--ice);box-shadow:0 0 10px #4d6bfe66}
.topbar .ava img{width:100%;height:100%;display:block}
.topbar .bt{font-size:13px;font-weight:800;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:Palatino,"Songti SC","Noto Serif SC",Georgia,serif;color:var(--ice)}
.tbtn{font:inherit;font-size:12px;color:var(--dim);background:#0a1130;border:1px solid var(--line);
  border-radius:99px;padding:5px 11px;cursor:pointer;transition:.15s;flex:0 0 auto;line-height:1.4}
.tbtn:hover{color:var(--ice);border-color:var(--royal)}
.tbtn:active{transform:scale(.95)}
.tbtn.warn:hover{color:var(--bad);border-color:var(--bad)}
/* 局内工具只在对局中显示（由 FSM 的 body[data-state] 驱动） */
#btnHist,#btnReset{display:none}
body[data-state="play"] #btnHist,body[data-state="result"] #btnHist,body[data-state="break"] #btnHist,
body[data-state="play"] #btnReset,body[data-state="result"] #btnReset,body[data-state="break"] #btnReset{display:inline-block}

/* ---------- HUD 状态条 ---------- */
.hud{position:sticky;top:47px;z-index:9;padding:8px 0 7px;background:#050a1e;border-bottom:1px solid #1a2450}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
.bar .bl{flex:0 0 auto;letter-spacing:.5px}
.track{flex:1;height:8px;border-radius:99px;background:#080e26;border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;width:100%;border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
#hpFill{background:linear-gradient(90deg,#ff7b9c,#ffd479)}
#daoFill{background:linear-gradient(90deg,#4d6bfe,#9fd4ff)}
.bar em{font-style:normal;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:30px;text-align:right;color:var(--ink)}
.stats{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.stats b{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;margin-left:2px}
.bag{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:0}
.chip{font-size:11px;color:var(--ink);background:#0b1330;border:1px solid var(--line);
  border-radius:99px;padding:3px 9px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--ice);color:var(--ice)}
.chip.passive{cursor:default;opacity:.75}
.chip.passive:hover{border-color:var(--line);color:var(--ink)}
.chip.lv{cursor:default;margin-left:8px;font-size:10.5px;color:var(--gold);border-color:#8a6d2f;
  background:transparent;vertical-align:3px;font-weight:600}
.chip.lv i{font-style:normal;color:var(--dim);margin-left:4px}
#buffbar .chip{cursor:default;border-color:#8a6d2f;color:var(--gold);background:#141433}

/* ---------- 舞台 & 页面淡入淡出 ---------- */
main{flex:1;display:flex;flex-direction:column;gap:10px;padding:6px 0 14px}
#screen{opacity:1;transform:none;transition:opacity .18s ease,transform .18s ease}
#screen.fade{opacity:0;transform:translateY(6px)}
.card{animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.tt{font-size:19px;line-height:1.35;margin:2px 0 0;letter-spacing:.3px}
h1.tt small{display:block;font-size:11px;font-weight:600;letter-spacing:2px;color:var(--violet);margin-bottom:5px}
.body{font-size:14.5px;line-height:1.75;color:var(--ink);margin:9px 0 0}
.body .q{color:var(--gold)}
code{font-family:var(--mono);font-size:.92em;color:var(--ice)}

/* ---------- 终端报错块 + compiling 加载动画 ---------- */
.term{background:#04081a;border:1px solid var(--line);border-radius:12px;margin:11px 0 0;overflow:hidden;
  box-shadow:0 8px 26px #00000055}
.cmd{font-size:11px;color:var(--dim);padding:7px 11px;border-bottom:1px solid #121a3c;
  font-family:var(--mono);word-break:break-all}
.cmd::before{content:"$ ";color:var(--ice)}
pre.code,pre.err{margin:0;padding:10px 11px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.7}
pre.code{color:#b5dcff}
pre.code .ln{color:#43528a;user-select:none;display:inline-block;width:1.9em}
pre.err{color:var(--bad);border-top:1px dashed #3a2450;background:#0d0820;white-space:pre-wrap;word-break:break-word}
pre.err .w{color:var(--warn)}
pre.err .n{color:var(--dim)}
pre.err.flash{animation:errflash .45s ease}
@keyframes errflash{0%{opacity:0}30%{opacity:1}45%{opacity:.35}60%{opacity:1}75%{opacity:.6}100%{opacity:1}}
/* compiling... 进度块：进入报错分支时的编译加载动画 */
.cmp{border-top:1px dashed #22305e;padding:10px 11px;font-family:var(--mono);font-size:12px;color:var(--ice);cursor:pointer}
.cmp .cl{display:flex;align-items:center;gap:8px}
.cmp .spin{width:11px;height:11px;flex:0 0 auto;border-radius:50%;
  border:2px solid #2b3d85;border-top-color:var(--ice);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cmp .dots::after{content:"";animation:dots 1s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.cmp .cbar{height:4px;border-radius:99px;background:#0a1130;border:1px solid #22305e;overflow:hidden;margin-top:8px}
.cmp .cbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--royal),var(--ice));
  animation:cfill .7s ease-out forwards}
@keyframes cfill{from{width:4%}to{width:96%}}
.cmp .cs{color:var(--dim);font-size:10.5px;margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.opts.veil{opacity:.28;pointer-events:none;filter:saturate(.4)}
.tline.veil{opacity:.28}
main.compiling [data-row]{pointer-events:none}

/* ---------- 选项按钮 ---------- */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px;transition:opacity .25s ease,filter .25s ease}
button.opt{
  text-align:left;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);border-left:3px solid #3a4f9e;border-radius:var(--r);
  padding:12px 13px;transition:transform .12s,border-color .15s,box-shadow .15s}
button.opt:hover{transform:translateX(2px);border-left-color:var(--ice);box-shadow:0 6px 20px #0b1c4a88}
button.opt:active{transform:scale(.985)}
button.opt .k{display:inline-block;min-width:17px;color:var(--violet);font-weight:700;margin-right:5px}
button.opt.right{border-left-color:var(--ok);box-shadow:0 0 0 1px #6fe7c866 inset}
button.out{opacity:.32;pointer-events:none;text-decoration:line-through}
button.danger{border-left-color:var(--bad)}
.hintline{font-size:11.5px;color:var(--dim);margin-top:9px}
.tline{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:11.5px;color:var(--warn);font-weight:600}
.tline .track{height:5px;flex:1;border-color:#57451c}
.tline em{font-style:normal;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
pre.code .row{display:block;border-radius:5px;padding:0 3px;margin:0 -3px}
pre.code.pick .row{cursor:pointer;transition:.12s}
pre.code.pick .row:hover{background:#9fd4ff21;box-shadow:inset 0 0 0 1px #9fd4ff66}
pre.code.pick .row:active{background:#9fd4ff33}

/* ---------- 结算条 ---------- */
.res{border-radius:var(--r);padding:12px 13px;margin-top:12px;font-size:13.5px;line-height:1.7;
  border:1px solid var(--line);animation:rise .25s ease both}
.res .tag{font-size:11px;letter-spacing:1.5px;font-weight:700;display:block;margin-bottom:4px}
.res.ok{background:linear-gradient(180deg,#0b2c30,#0a1638);border-color:#1d6b5c}
.res.ok .tag{color:var(--ok)}
.res.warn{background:linear-gradient(180deg,#2c2814,#131637);border-color:#6b5a1d}
.res.warn .tag{color:var(--warn)}
.res.bad{background:linear-gradient(180deg,#2e1430,#150d2c);border-color:#6b2450}
.res.bad .tag{color:var(--bad)}
.delta{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:12px}
.delta span{background:#080e26;border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-variant-numeric:tabular-nums}
.up{color:var(--ok)} .down{color:var(--bad)} .neu{color:var(--dim)}
.next{margin-top:11px;width:100%;font:inherit;font-size:15px;font-weight:700;cursor:pointer;color:#04102e;
  background:linear-gradient(90deg,var(--royal),var(--ice));border:0;border-radius:var(--r);padding:13px;transition:.15s;
  box-shadow:0 6px 22px #4d6bfe44}
.next:hover{filter:brightness(1.08)}
.next:active{transform:scale(.98)}

/* ---------- 首页 / 星庭引路人 ---------- */
.hero{text-align:center;padding:22px 0 4px}
.hero .zh{font-size:30px;font-weight:800;letter-spacing:3px;margin:0;
  font-family:Palatino,"Songti SC","Noto Serif SC",Georgia,serif;
  background:linear-gradient(92deg,var(--ice),#ffffff 40%,var(--royal) 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:12.5px;color:var(--dim);margin:8px 0 0;letter-spacing:1px}
.guide{display:flex;gap:13px;align-items:center}
.guide .pic{flex:0 0 92px;width:92px;height:112px;border-radius:12px;overflow:hidden;
  border:1px solid #3a4f9e;outline:3px solid #9fd4ff1e;box-shadow:0 8px 24px #0b1c4a99}
.guide .pic img{width:100%;height:100%;object-fit:cover;display:block}
.guide .gt{min-width:0}
.guide .gn{font-size:14px;font-weight:800;color:var(--ice);letter-spacing:1px}
.guide .gn small{color:var(--violet);font-weight:600;font-size:10.5px;margin-left:6px;letter-spacing:2px}
.guide .gq{font-size:12.5px;color:var(--ink);line-height:1.75;margin-top:5px}
.guide .gq b{color:var(--gold)}
.sect{background:linear-gradient(180deg,#0d1634ee,#0b1230ee);border:1px solid var(--line);
  border-radius:var(--r);padding:13px;margin-top:12px;box-shadow:0 10px 28px #030616aa}
.sect h3{margin:0 0 9px;font-size:13px;letter-spacing:1px;color:var(--ice)}
.name{width:100%;font:inherit;font-size:15px;color:var(--ink);background:#080e26;border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;outline:none}
.name:focus{border-color:var(--royal);box-shadow:0 0 0 3px #4d6bfe2e}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segb{font:inherit;font-size:13.5px;font-weight:700;color:var(--dim);text-align:left;cursor:pointer;
  background:#0a1130;border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:.15s}
.segb small{display:block;font-weight:400;font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.5}
.segb.on{border-color:var(--royal);color:var(--ink);background:linear-gradient(180deg,#18245c,#101838);
  box-shadow:0 0 0 1px #4d6bfe55 inset}
.segb.on small{color:#a9bce8}
ol.lb{margin:0;padding:0;list-style:none;counter-reset:x}
ol.lb li{counter-increment:x;display:flex;align-items:center;gap:9px;font-size:13px;
  padding:7px 8px;border-bottom:1px dashed #1c2850}
ol.lb li:last-child{border-bottom:0}
ol.lb li::before{content:counter(x);flex:0 0 22px;text-align:center;color:var(--dim);font-variant-numeric:tabular-nums}
ol.lb li:nth-child(1)::before{content:"👑"}
ol.lb li:nth-child(2)::before{content:"🥈"}
ol.lb li:nth-child(3)::before{content:"🥉"}
ol.lb .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.lb .sc{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700}
ol.lb li.me{background:linear-gradient(90deg,#4d6bfe26,transparent);border-radius:8px}
ol.lb li.empty{justify-content:center;color:var(--dim);font-size:12px}
ol.lb li.empty::before{display:none}
.tabs{display:flex;gap:6px;margin:0 0 9px}
.tab{font:inherit;font-size:11.5px;color:var(--dim);background:#0a1130;border:1px solid var(--line);
  border-radius:99px;padding:3px 12px;cursor:pointer}
.tab.on{color:var(--ice);border-color:var(--royal)}
.badge{font-size:9.5px;color:var(--violet);border:1px solid #3a4f9e;border-radius:6px;padding:0 5px;margin-left:5px}
.foot{font-size:11px;color:#55639b;text-align:center;padding:14px 0 22px;line-height:1.8}
.hidden{display:none!important}
.shake{animation:shk .38s}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}70%{transform:translateX(-3px)}}

/* ---------- Toast ---------- */
.pop{position:fixed;left:50%;top:74px;transform:translateX(-50%);z-index:60;pointer-events:none;
  font-size:13px;font-weight:700;padding:7px 14px;border-radius:99px;background:#0a1130f2;
  border:1px solid var(--gold);color:var(--gold);box-shadow:0 8px 24px #00000088;
  animation:pop 1.6s ease forwards;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
/* 密令解锁的星屑迸发 */
.spark{position:fixed;z-index:70;pointer-events:none;color:var(--ice);font-size:15px;
  animation:spark 1.1s ease-out forwards;text-shadow:0 0 8px var(--royal)}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}

/* ---------- 浮层（手册 / 图鉴 / 错题本 / 履历 / 确认框） ---------- */
.ovl{position:fixed;inset:0;z-index:40;background:#02040ecc;display:flex;align-items:flex-end;justify-content:center;
  opacity:1;transition:opacity .18s ease}
.ovl.fade{opacity:0}
.sheet{width:100%;max-width:680px;max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#0b1230;border:1px solid #31459e;border-bottom:0;border-radius:18px 18px 0 0;
  padding:16px var(--pad) calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 50px #00000099;animation:sheetup .22s ease both}
@keyframes sheetup{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 2px;font-size:17px;color:var(--ice);letter-spacing:1px}
.sheet .sh{font-size:11.5px;color:var(--dim);margin:0 0 10px;line-height:1.7}
.dx{border-bottom:1px dashed #1c2850;padding:10px 0}
.dx:last-of-type{border-bottom:0}
.dx .dn{font-size:13.5px;font-weight:700}
.dx .dc{font-size:11px;color:var(--bad);font-family:var(--mono);margin-top:5px;word-break:break-word;line-height:1.6}
.dx .de{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.7}
.dx.lock{opacity:.42}
.dx.lock .dn::before{content:"🔒 "}
.dx .dk{font-size:12px;color:var(--gold);margin-top:6px;line-height:1.7}
.nb{border-bottom:1px dashed #1c2850;padding:10px 0}
.nb:last-of-type{border-bottom:0}
.nb .nt{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nb .nd{font-size:10px;color:var(--dim);font-weight:400;flex:0 0 auto;margin-top:2px}
.nb .dw{font-size:12px;color:var(--bad);margin-top:6px;line-height:1.6}
.nb .dr{font-size:12px;color:var(--ok);margin-top:4px;line-height:1.6}
.nb .dk{font-size:12px;color:var(--gold);margin-top:6px;line-height:1.7}
.close{width:100%;margin-top:14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:#04102e;
  background:linear-gradient(90deg,var(--ice),var(--royal));border:0;border-radius:12px;padding:12px}
.close:active{transform:scale(.98)}
.ach .g{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  border-bottom:1px dashed #1c2850;padding:9px 2px;font-size:13px}
.ach .g:last-child{border-bottom:0}
.ach .gn{font-weight:700}
.ach .gd{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.6}
.ach .g.lock{opacity:.45}
.ach .g.lit .gn{color:var(--ice)}
.ach .g .st{flex:0 0 auto;font-size:10.5px;color:var(--ok);border:1px solid #1d6b5c;border-radius:99px;padding:2px 8px}
/* 结局图鉴卡片：点亮 vs 上锁 */
.endgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.endcard{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#0a1130;position:relative;overflow:hidden}
.endcard .en{font-size:13.5px;font-weight:800}
.endcard .ed{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.65}
.endcard.lit{border-color:#4d6bfe;background:linear-gradient(160deg,#18245c,#0d1330 70%);
  box-shadow:0 0 18px #4d6bfe33}
.endcard.lit .en{color:var(--ice)}
.endcard.lit::after{content:"✦";position:absolute;right:8px;top:6px;color:var(--gold);font-size:13px;text-shadow:0 0 8px var(--gold)}
.endcard.lock{opacity:.5}
.endcard.lock .en{color:var(--dim)}
/* 秘令输入区 */
.secret{margin-top:14px;border:1px dashed #3a4f9e;border-radius:12px;padding:11px 12px;background:#0a113088}
.secret .sl{font-size:12px;color:var(--violet);font-weight:700;letter-spacing:1px}
.secret .sr{display:flex;gap:8px;margin-top:8px}
.secret input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:13px;color:var(--ice);
  background:#060b22;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
.secret input:focus{border-color:var(--royal)}
.secret button{font:inherit;font-size:13px;font-weight:700;color:#04102e;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(90deg,var(--royal),var(--ice));border:0;border-radius:9px;padding:0 16px}
.secret .hint{font-size:10.5px;color:var(--dim);margin-top:7px;line-height:1.6}
/* 本局履历 */
.hist .hrow{display:flex;gap:9px;padding:8px 2px;border-bottom:1px dashed #1c2850;font-size:12.5px;line-height:1.65}
.hist .hrow:last-child{border-bottom:0}
.hist .hi{flex:0 0 22px;text-align:center}
.hist .ht{flex:1;min-width:0}
.hist .ht small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px}
.endbanner{margin-top:12px;border-radius:var(--r);padding:12px 13px;font-size:13.5px;line-height:1.8;
  background:linear-gradient(120deg,#2c2814,#1c1650 60%,#0e2c3a);border:1px solid #8a6d2f;animation:rise .35s ease both}
.endbanner .tag{font-size:11px;letter-spacing:1.5px;font-weight:700;display:block;margin-bottom:4px;color:var(--gold)}
/* 结算页引路人点评 */
.verdict{display:flex;gap:11px;align-items:flex-start}
.verdict .va{flex:0 0 44px;width:44px;height:44px;border-radius:50%;overflow:hidden;border:1.5px solid var(--ice);
  box-shadow:0 0 12px #4d6bfe66}
.verdict .va img{width:100%;height:100%;display:block}
.verdict .vt{flex:1;min-width:0;font-size:13px;line-height:1.8}
.verdict .vt b{color:var(--ice)}

/* ---------- 移动端适配 ---------- */
@media (max-width:480px){
  :root{--pad:12px}
  .topbar .bt{font-size:12px}
  .tbtn{padding:5px 9px;font-size:11.5px}
  .hero .zh{font-size:25px;letter-spacing:2px}
  .guide .pic{flex-basis:78px;width:78px;height:96px}
  .endgrid{grid-template-columns:1fr}
  h1.tt{font-size:17px}
  .body{font-size:14px}
  button.opt{font-size:13.5px;padding:11px 11px}
  pre.code,pre.err{font-size:11.8px}
  .hud{top:45px}
}
@media (max-width:360px){
  .topbar .bt{display:none}
  .stats{font-size:10.5px}
}
/* 桌面端浮层居中成对话框 */
@media (min-width:720px){
  .ovl{align-items:center}
  .sheet{border-radius:18px;border-bottom:1px solid #31459e;max-height:82vh;
    padding-bottom:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* =====================================================================
   ✅✅ 新增代码块 ①（CSS）：自动主题层
   ------------------------------------------------------------------
   · 完全独立的一层覆盖，不修改上方任何一条原有规则；
   · <html data-theme="dark|light"> 控制深/浅底；
   · <html data-mood="calm|bright|storm|crash"> 控制配色氛围；
   · 由底部 JS 依据 灵力 hp / 道心 dao / 连对 combo / 连错 mis 自动写入。
   ===================================================================== */

/* ---------- A. 浅色主题（Dev-C++ 6 经典白底 IDE 风） ---------- */
html[data-theme="light"]{
  scrollbar-color:#a9b6cc #eef1f6;
  --bg:#eef1f6; --bg2:#e6eaf2; --card:#ffffff; --card2:#f6f8fc;
  --line:#c3ccdd; --line2:#c3ccdd33; --ink:#141a24; --dim:#5b6779;
  --royal:#1b56c9; --ice:#0b5fa5; --gold:#8a5a00; --violet:#5b3fb8;
  --ok:#0a7f5f; --warn:#9a6a00; --bad:#c0234a;
}
html[data-theme="light"] body{
  background:linear-gradient(180deg,#fbfcfe 0%,#eef1f7 46%,#e7ebf3 100%);
}
html[data-theme="light"] ::-webkit-scrollbar-track{background:#e9edf4}
html[data-theme="light"] ::-webkit-scrollbar-thumb{background:#a9b6cc;border-color:#e9edf4}
html[data-theme="light"] ::-webkit-scrollbar-thumb:hover{background:#1b56c9}
html[data-theme="light"] #stars{opacity:0}

html[data-theme="light"] #boot .bterm{background:#fff;border-color:#c3ccdd;color:#0b5fa5}
html[data-theme="light"] #boot .bbar{background:#eef2f8;border-color:#c3ccdd}

html[data-theme="light"] .topbar{background:#fffffff2;border-bottom-color:#d3dae8}
html[data-theme="light"] .tbtn{background:#f2f5fa;color:#4a5666;border-color:#c9d3e3}
html[data-theme="light"] .tbtn:hover{color:#0b5fa5;border-color:#1b56c9}
html[data-theme="light"] .tbtn.warn:hover{color:#c0234a;border-color:#c0234a}
html[data-theme="light"] .hud{background:#f7f9fce8;border-bottom-color:#d3dae8}
html[data-theme="light"] .track{background:#e2e7f0;border-color:#c9d3e3}

html[data-theme="light"] .chip:hover{border-color:#1b56c9;color:#0b5fa5}
html[data-theme="light"] .chip.lv{color:#8a5a00;border-color:#dcc38a;background:transparent}
html[data-theme="light"] #buffbar .chip{background:#fff8e8;border-color:#dcc38a;color:#8a5a00}

html[data-theme="light"] .sect{background:#fff;border-color:#d3dae8;box-shadow:0 8px 22px #26355a15}
html[data-theme="light"] .hero .zh{background:linear-gradient(92deg,#0b5fa5,#1b56c9 55%,#5b3fb8)}
html[data-theme="light"] .name{background:#fff;border-color:#c9d3e3;color:#141a24}
html[data-theme="light"] .segb{background:#f4f7fb;border-color:#c9d3e3;color:#4a5666}
html[data-theme="light"] .segb.on{background:linear-gradient(180deg,#e9f2ff,#dae7fb);border-color:#1b56c9;color:#141a24}
html[data-theme="light"] .segb.on small{color:#42536b}
html[data-theme="light"] .tab{background:#f4f7fb;border-color:#c9d3e3;color:#4a5666}

html[data-theme="light"] ol.lb li{border-bottom-color:#dde4ef}
html[data-theme="light"] ol.lb li.me{background:linear-gradient(90deg,#1b56c91f,transparent)}
html[data-theme="light"] .guide .pic{border-color:#a9bcd8;outline-color:#1b56c920;box-shadow:0 8px 18px #26355a22}

html[data-theme="light"] .term{background:#fff;border-color:#c3ccdd;box-shadow:0 6px 16px #26355a12}

html[data-theme="light"] code{color:#0b5fa5}

html[data-theme="light"] pre.err .n{color:#6b7787}

html[data-theme="light"] .cmp .spin{border-color:#c9d3e3;border-top-color:#1b56c9}

html[data-theme="light"] button.opt{background:linear-gradient(180deg,#ffffff,#f4f7fb);
  border-color:#c9d3e3;border-left-color:#93a5c2;color:#141a24}
html[data-theme="light"] button.opt:hover{border-left-color:#1b56c9;box-shadow:0 6px 16px #26355a1f}

html[data-theme="light"] .endbanner{background:linear-gradient(120deg,#fdf3db,#eaf1ff 60%,#e7f7f0);border-color:#dcc38a}

  border-color:#1b56c9;box-shadow:0 0 14px #1b56c924}
html[data-theme="light"] .secret{background:#f7f9fc;border-color:#a9bcd8}
html[data-theme="light"] .secret input{background:#fff;border-color:#c9d3e3;color:#0b5fa5}

/* ---------- B. 心境氛围层（由 HP / 道心 / 连对 / 连错 自动切换） ---------- */
/* ① bright · 心境通明（连对且血线健康）：浅色 + 暖阳金边 */
html[data-mood="bright"]{--gold:#a97400;--ice:#0b5fa5}
html[data-mood="bright"][data-theme="light"] body{
  background:linear-gradient(180deg,#fffdf6 0%,#f4f7fd 48%,#e9f0f8 100%);
}
html[data-mood="bright"] #moodfx{opacity:1;
  background:radial-gradient(1100px 620px at 50% -12%,#ffd47930 0%,transparent 62%),
             radial-gradient(900px 700px at 50% 112%,#0e9ad61f 0%,transparent 60%)}

/* ② calm · 星庭常态（默认深色，等价于原样式，不加任何改动） */
html[data-mood="calm"] #moodfx{opacity:0}

/* ③ storm · 雷云压顶（血/道心下滑或已连错 2 次）：深紫 + 闪电脉动 */
html[data-mood="storm"]{
  --bg:#080518; --bg2:#0f0a28; --card:#140e30; --card2:#1a1240;
  --line:#3a2c78; --ink:#e7e2ff; --dim:#a295d0;
  --royal:#8b5cf6; --ice:#cdb8ff; --violet:#b39dff;
}
html[data-mood="storm"] body{
  background:radial-gradient(1000px 560px at 12% -10%,#2a1a63 0%,transparent 62%),
             radial-gradient(820px 520px at 108% 8%,#1a1145 0%,transparent 58%),
             radial-gradient(700px 700px at 50% 118%,#140d33 0%,transparent 60%),var(--bg);
  background-attachment:fixed;
}
html[data-mood="storm"] .topbar{background:#080518f2;border-bottom-color:#2b2160}
html[data-mood="storm"] .hud{background:#080518;border-bottom-color:#2b2160}
html[data-mood="storm"] #moodfx{opacity:1;animation:moodBolt 3.6s ease-in-out infinite;
  background:radial-gradient(1000px 620px at 50% -14%,#8b5cf630 0%,transparent 60%),
             radial-gradient(1200px 800px at 50% 116%,#4c1f8a33 0%,transparent 62%)}
@keyframes moodBolt{0%,88%,100%{filter:brightness(1)}91%{filter:brightness(1.9)}94%{filter:brightness(1.15)}}

/* ④ crash · 走火入魔（血皮/道心崩线或连错 3 次）：赤黑 + 心跳暗角 */
html[data-mood="crash"]{
  --bg:#150309; --bg2:#1d0510; --card:#210616; --card2:#2c0a1e;
  --line:#7a2135; --ink:#ffe9ee; --dim:#d491a4;
  --royal:#ff4d6d; --ice:#ffb3c4; --gold:#ffab6b; --violet:#ff8fb0;
}
html[data-mood="crash"] body{
  background:radial-gradient(900px 520px at 14% -10%,#5b1226 0%,transparent 60%),
             radial-gradient(820px 520px at 106% 8%,#3c0c1e 0%,transparent 56%),
             radial-gradient(700px 700px at 50% 118%,#2a0714 0%,transparent 60%),var(--bg);
  background-attachment:fixed;
}
html[data-mood="crash"] .topbar{background:#150309f2;border-bottom-color:#5a1728}
html[data-mood="crash"] .hud{background:#150309;border-bottom-color:#5a1728}
html[data-mood="crash"] #hpFill{background:linear-gradient(90deg,#ff2d55,#ff9d6b)}
html[data-mood="crash"] #moodfx{opacity:1;animation:moodPulse 1.5s ease-in-out infinite;
  background:radial-gradient(1400px 900px at 50% 50%,transparent 44%,#ff2d5533 78%,#7a0f2466 100%)}
@keyframes moodPulse{0%,100%{opacity:.55}50%{opacity:1}}

/* 心境联动：选项按钮左侧竖条（原稿写死 #3a4f9e，这里按氛围覆色，仅新增覆盖） */
html[data-mood="storm"] button.opt{border-left-color:#5b48b8}
html[data-mood="storm"] button.opt:hover{border-left-color:var(--ice)}
html[data-mood="crash"] button.opt{border-left-color:#9e2440}
html[data-mood="crash"] button.opt:hover{border-left-color:var(--ice)}
html[data-mood="bright"][data-theme="light"] button.opt{border-left-color:#a9bcd8}
/* 图鉴亮卡、祭祀面板等残留的宝蓝硬色，同步跟心境 */
html[data-mood="storm"] .endcard.lit{border-color:var(--royal);box-shadow:0 0 18px #8b5cf633}
html[data-mood="crash"] .endcard.lit{border-color:var(--royal);box-shadow:0 0 18px #ff4d6d33}

/* 暗角/氛围层：纯装饰，永远不拦截点击 */
#moodfx{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
  transition:opacity .6s ease}
/* 答题即时反馈闪：连对=暖金，答错=赤红（只动氛围层，不动任何面板） */
#moodfx.mflash-ok{animation:mflash .55s ease-out 1}
#moodfx.mflash-bad{animation:mflashBad .55s ease-out 1}
@keyframes mflash{
  0%{opacity:1;background:radial-gradient(1400px 900px at 50% 50%,transparent 30%,#ffd47955 100%)}
  100%{opacity:0;background:radial-gradient(1400px 900px at 50% 50%,transparent 30%,#ffd47900 100%)}
}
@keyframes mflashBad{
  0%{opacity:1;background:radial-gradient(1400px 900px at 50% 50%,transparent 26%,#ff2d5566 100%)}
  100%{opacity:0;background:radial-gradient(1400px 900px at 50% 50%,transparent 26%,#ff2d5500 100%)}
}

/* ---------- C. 「编译器麻了」彩蛋弹窗（连点重置 5 次触发） ---------- */
#eggOvl{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
  padding:20px;background:#02040ecc;animation:eggFade .2s ease both}
@keyframes eggFade{from{opacity:0}to{opacity:1}}
#eggOvl .eggcard{width:100%;max-width:400px;text-align:center;border-radius:18px;padding:20px 18px;
  background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  box-shadow:0 20px 60px #00000099;animation:eggUp .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes eggUp{from{transform:translateY(18px) scale(.96);opacity:.3}to{transform:none;opacity:1}}
html[data-theme="light"] #eggOvl{background:#26355a55}
#eggOvl .eggface{font-size:46px;line-height:1;animation:eggSpin 1.1s ease-in-out infinite}
@keyframes eggSpin{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
#eggOvl .eggt{margin-top:12px;font-size:16px;font-weight:800;letter-spacing:.4px;color:var(--warn)}
#eggOvl .eggs{margin-top:9px;font-size:12px;line-height:1.9;color:var(--dim);font-family:var(--mono)}
#eggOvl .eggs b{color:var(--bad)}
#eggOvl .eggb{margin-top:15px;width:100%;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
  color:#04102e;background:linear-gradient(90deg,var(--royal),var(--ice));border:0;border-radius:12px;padding:12px}
#eggOvl .eggb:active{transform:scale(.98)}
html[data-theme="light"] #eggOvl .eggb{color:#fff}
#eggOvl .eggh{margin-top:8px;font-size:10.5px;color:var(--dim);letter-spacing:.5px}
@media (prefers-reduced-motion:reduce){
  #eggOvl .eggface{animation:none}
  #moodfx{animation:none!important}
}

/* =====================================================================
   ✅✅ 新增代码块 ③（补丁层 CSS）：移动端 / 观感 局部修补
   ------------------------------------------------------------------
   · 全部写在原有样式与「自动主题层」之后，只用覆盖规则，不改任何原规则；
   · 每条都对应审计报告里的一条实测问题，编号 P-M1…P-M9 / P-J1…P-J4；
   · 整块删除即回到当前线上版本（零耦合）。
   ===================================================================== */
/* P-M1 ≤480px 时 HUD 吸顶 top 原为 45px，顶栏实测 47px，滚动时上沿被裁 2px */
@media (max-width:480px){ .hud{top:47px} }

/* P-M2 顶栏 5 个按钮实测仅 28px 高（iOS/Android 建议 ≥44px）：
        用伪元素把热区扩到 ~46px，按钮视觉尺寸与顶栏高度完全不变 */
.topbar .tbtn{position:relative}
.topbar .tbtn::before{content:"";position:absolute;left:-3px;right:-3px;top:-9px;bottom:-9px}

/* P-M3 飘字 toast 原固定在 top:74px（多条时 74/116/158），正好压在 HUD 的
        灵力/道心条上（实测重叠 35px）：这里先整体下移兜底，块 ④ 再把窄屏
        的飘字改到底部吸附（等效 snackbar），两条都不再遮挡数值与题干 */
@media (max-width:719px), (max-height:540px){
  .pop{margin-top:74px;max-width:86vw;text-align:center;font-size:12px;padding:5px 12px}
}

/* P-M4 触屏：连点选项时禁止双击缩放与长按选词（原 touch-action/user-select 均为默认） */
@media (hover:none){
  button,.chip,.tab,.next,.close,.dx,.nb,.hist .h{
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
  }
}

/* P-M5 iOS Safari 会自动放大正文（text-size-adjust:auto），字号观感漂移 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* P-M6 游戏内上下滚动时屏蔽下拉刷新/横向回弹，避免误触离开页面 */
html,body{overscroll-behavior-y:contain;overscroll-behavior-x:none}

/* P-M7 100vh 在 iOS 上含地址栏高度，底部一行常被切成半截 */
@supports (height:100svh){ body{min-height:100svh} #wrap{min-height:100svh} }

/* P-M8 手机横屏（可视高 ~390px）：HUD 实测 92px 吃掉 24% 屏幕，
        压缩后题干+选项可同屏，减少「看不到继续按钮」 */
@media (orientation:landscape) and (max-height:540px){
  .hud{padding:4px 0 4px}
  .hud .bars .bar{gap:6px}
  .hud .stats{gap:5px 8px}
  .hud .bag{margin-top:3px}
  #buffbar{margin-top:2px}
}
/* P-M9 结算「继续」按钮：解析一长就被顶到首屏外（实测 iPhone13 只剩 10px 余量），
        窄屏改为底部常驻，单手不用来回找按钮；#wrap 预留 56px 避免压住最后一行 */
@media (max-width:719px){
  body[data-state="result"] #go, body[data-state="break"] #go{
    position:sticky;bottom:12px;z-index:8;box-shadow:0 10px 26px #00000059;
  }
  #wrap{padding-bottom:56px}
}
/* 结算条在窄屏略微贴底时最后 3px 会被切掉 */
@media (max-width:719px){ .res{padding:11px 12px} }
/* 浅色主题下的浮层/彩蛋弹窗已由 ① 覆盖，这里补一个滚动惯性 */
.sheet{-webkit-overflow-scrolling:touch}

/* =====================================================================
   ✅✅ 新增代码块 ⑥-CSS（特效层）：点击「星环炸裂」
   ------------------------------------------------------------------
   · 只在 #sring 容器内播放，容器 pointer-events:none，永远不吃点击；
   · 颜色全部走 CSS 变量，跟随块 ① 的 data-mood / data-theme，JS 不写颜色；
   · 减弱动效（prefers-reduced-motion）时整层静默；
   · 删掉本块 + 块 ⑥-JS 即可完全退回原状。
   ===================================================================== */
#sring{position:fixed;inset:0;z-index:99;pointer-events:none;
  --sc:#7fd6ff;--sg:rgba(127,214,255,.5)}
html[data-mood="bright"] #sring{--sc:#ffc94d;--sg:rgba(255,201,77,.6)}
html[data-mood="bright"][data-theme="light"] #sring{--sc:#9c6a00;--sg:rgba(180,125,0,.5)}
html[data-mood="storm"] #sring{--sc:#b7a4ff;--sg:rgba(150,120,255,.55)}
html[data-mood="crash"] #sring{--sc:#ff6f85;--sg:rgba(255,80,110,.6)}
#sring i{position:fixed;left:var(--x);top:var(--y);display:block;opacity:0;font-style:normal}
#sring .srh{margin:calc(var(--sr)/-2) 0 0 calc(var(--sr)/-2);width:var(--sr);height:var(--sr);
  border:2px solid var(--sc);border-radius:50%;
  box-shadow:0 0 14px var(--sg),inset 0 0 12px var(--sg);
  animation:sdRing var(--sd) cubic-bezier(.16,.84,.3,1) forwards}
#sring .srh.e{border-width:1px;animation-duration:calc(var(--sd)*1.3);animation-delay:.08s}
#sring .srf{margin:-13px 0 0 -13px;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle,var(--sc) 0%,rgba(0,0,0,0) 70%);
  animation:sdFlash 240ms ease-out forwards}
#sring .srd{margin:-2.5px 0 0 -2.5px;width:5px;height:5px;border-radius:50%;background:var(--sc);
  box-shadow:0 0 8px var(--sg);animation:sdFly var(--sd) ease-out forwards}
#sring .srg{margin:-8px 0 0 -8px;font-size:13px;color:var(--sc);
  text-shadow:0 0 8px var(--sg);animation:sdFly calc(var(--sd)*1.1) ease-out forwards}
@keyframes sdRing{0%{opacity:.9;transform:scale(.14)}62%{opacity:.38}100%{opacity:0;transform:scale(1)}}
@keyframes sdFlash{0%{opacity:.95;transform:scale(.35)}100%{opacity:0;transform:scale(1.6)}}
@keyframes sdFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
@media (prefers-reduced-motion:reduce){#sring{display:none}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   《代码渡劫模拟器》参赛最终版 · 引擎
   ---------------------------------------------------------------------
   架构总览（评审导读）：
   [数据层]  DEX / DEXINFO / POOL / BUFFS / ENDS / ACH —— 全部内容数据
   [状态机]  FSM：boot → home → play ⇄ result → break/ending，
             所有页面跳转必须经 FSM.go() 校验，杜绝跳关与死节点
   [服务层]  Save（本地存档）/ AudioFX（内嵌合成音效）/ Stars（星野）
   [引擎层]  buildQueue 造关 → render 渲染 → resolve 结算 → advance 推进
             → endGame/finish 结算，全程单向数据流
   加题只改 POOL，不要动引擎；节点线性推进，不存在断链跳转。
   ===================================================================== */
/* ---------- 0. 小工具 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=rnd(i+1);const t=b[i];b[i]=b[j];b[j]=t;}return b;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const CFG={hp:100,dao:100,par:340,  /* 手速基准秒数：与 22+ 关的加长流程匹配 */
  LB:'cdtj_lb_v3', DEX:'cdtj_dex_v2', NAME:'cdtj_name_v2',
  ACH:'cdtj_ach_v1', ACHSTAT:'cdtj_achstat_v1', END:'cdtj_end_v1',
  BOOK:'cdtj_book_v1',
  SAVE:'cdtj_save_v1',   /* 最终版新增：局内进度存档（每关入口自动落盘） */
  SND:'cdtj_snd_v1'};    /* 最终版新增：音效开关偏好 */
/* 兼容性：老浏览器没有 structuredClone 时的兜底，放在引擎之前 */
if(typeof structuredClone!=='function'){ window.structuredClone=o=>JSON.parse(JSON.stringify(o)); }

/* ---------- 1. 报错图鉴（✅新增：C语言五大经典天劫） ---------- */
const DEX={
  implicit:'implicit declaration', nullderef:'NULL dereference', typedef:'未知类型名',
  stray:'stray 全角字符', guard:'头文件重复定义',
  wild:'未初始化指针', uaf:'use-after-free', dangle:'返回栈地址', oob:'数组越界',
  underflow:'无符号下界死循环', noexit:'递归无出口', eof:'scanf 返回值',
  dfloat:"%d 打 double", sptr:'%s 打字符', zzu:'sizeof 用 %d',
  doublefree:'double free', segv:'Segmentation fault',
  leak:'内存泄漏',  /* ✅ 加长版新增图鉴条目 */
  nullmacro:'NULL 未定义', intoverflow:'有符号整数溢出', ptrmath:'指针算术踩错步长',
  floatprec:'浮点精度陷阱', evalorder:'参数求值顺序未定义'  /* ✅ 新玩法5：题库扩容图鉴 */
};

/* ✅ 改动8（新增）：报错手册文案表。图鉴不再只是一个英文键，而是一条能翻的笔记：
   n=中文名  c=真实报错片段  e=一句话讲解（含"下次怎么办"）
   ✅ 新玩法4：k=一句话知识点——解锁条目后附在图鉴底部，错题本也复用这一句 */
const DEXINFO={
 implicit:{n:'隐式函数声明',c:"error: implicit declaration of function 'printf'",
  e:'调了库函数却没写 #include。GCC 14 起不再"提醒一下"，直接判 error。',
  k:'隐式声明：没写 #include 就调用库函数，编译器只认它见过的函数。'},
 typedef:{n:'未知类型名 / 链接期失踪',c:"undefined reference to `sqrt'  ·  'FILE' undeclared",
  e:'声明在头文件里，实现在库里。math 要 #include <math.h> 再加 -lm，少一件都不行。',
  k:'链接错误 undefined reference：声明在头文件、实现却在库里，编译过了不代表链接能过。'},
 stray:{n:'stray 乱码字符',c:"error: stray '\\343' in program",
  e:'全角分号、中文引号在 UTF-8 里是好几个字节，编译器不认识。写代码请切英文输入法。',
  k:'stray 错误：全角分号、中文引号不是 C 的标点，写代码请切英文输入法。'},
 guard:{n:'头文件重复定义',c:"error: redefinition of 'struct Node'",
  e:'同一个头被引了两次。#ifndef/#define/#endif 三件套是 C 的护体罡气，#pragma once 是方言。',
  k:'重复定义：头文件被包含两次，同一份声明就抄了两遍；#ifndef 三件套保平安。'},
 nullderef:{n:'空指针解引用',c:'Segmentation fault · Address (nil) suggests NULL dereference',
  e:'地址 0x0 是内核禁区。malloc、fopen、链表尾都会给你 NULL，它们不会替你检查。',
  k:'空指针：指向地址 0 的指针，禁止解引用；用前先判 if (p != NULL)。'},
 wild:{n:'未初始化指针',c:"warning: 'p' is used uninitialized [-Wuninitialized]",
  e:'指针里装的是上一任留下的垃圾地址。它有时能跑对——这才是最阴的地方（未定义行为）。',
  k:'野指针：没初始化的指针装的是垃圾地址，读了就是未定义行为，跑对全靠运气。'},
 dangle:{n:'返回栈上地址',c:'warning: function returns address of local variable',
  e:'函数一返回，那块栈就退房了。你带走的钥匙开的是别人家的门。',
  k:'悬垂指针：函数返回后局部变量就没了，还指着旧地址的指针就是悬垂指针。'},
 uaf:{n:'释放后继续使用',c:'heap-use-after-free · Invalid write of size 4',
  e:'free 之后指针的值还在，地已经归别人了。free 完立刻置 NULL。',
  k:'use-after-free：free 之后再用那块内存，等于住进被拆掉的房子；free 后立刻置 NULL。'},
 doublefree:{n:'二次释放',c:'free(): double free detected in tcache 2',
  e:'同一块内存超度两次，glibc 直接 abort。它不是崩溃，是尽职。',
  k:'double free：同一块内存 free 两次会直接 abort；把指针置 NULL 后再 free 是安全的。'},

/* ---------- 1b. ✅ 新玩法5：题库难度分级（一品/二品/三品） ----------
   每道题可标 lv（1 易 / 2 中 / 3 难），未标则按劫别取默认档（LVDF）。
   三品功德 ×1.2、二品 ×1.1、一品 ×1.0；题目标题旁亮出品级徽章。
   图灵之光全程把实际难度压一档（不影响原题数据，纯读取时换算）。 */
const LVN={1:'一品',2:'二品',3:'三品'};
const LVDF={头文件劫:1,格式劫:1,段劫:2,指针劫:2,循环劫:2,内存劫:3,'天劫 · 二重':2,'天劫 · 三重':3,天机:1,心魔劫:1};
function lvOf(node){
  if(node==null) return 1;
  let lv=node.lv||LVDF[node.cat]||1;
  if(S&&buffGet('turing')) lv=Math.max(1,lv-1);   /* ✅ 图灵之光：全程降一档难度 */
  return lv;
}

/* =====================================================================
   3. 有限状态机（FSM）—— 所有页面跳转的唯一入口
   ---------------------------------------------------------------------
   boot   开场加载动画
   home   山门首页（报道号 / 选模式 / 继续上局）
   play   答题中（含 compiling 子相位，由 S.compiling 标记）
   result 单关结算条已弹出，等待「继续」
   break  赛季局间调息
   ending 终局结算页
   合法迁移表之外的跳转一律拒绝并告警——从机制上杜绝跳关 / 死节点。
   ===================================================================== */
const FSM={
  state:'boot',
  allow:{
    boot:  ['home'],
    home:  ['home','play','break'],
    play:  ['play','result','break','ending','home'],
    result:['play','result','break','ending','home'],
    break: ['play','ending','home'],
    ending:['play','home']
  },
  go(next){
    if(this.state===next&&next!=='play'&&next!=='home'&&next!=='result') {
      console.warn('[FSM] 非法自迁移:',next); return false;
    }
    const ok=(this.allow[this.state]||[]).includes(next);
    if(!ok){ console.warn('[FSM] 非法迁移被拦截:',this.state,'→',next); return false; }
    this.state=next;
    document.body.dataset.state=next;   /* 顶栏局内按钮的显隐由 CSS 据此驱动 */
    return true;
  },
  is(...s){ return s.includes(this.state); }
};

/* ---------- 3b. 通用本地存储（全部 try/catch，隐私模式下不抛错不卡死） ---------- */
function lsGet(k,fb){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?fb:v; }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
const reducedMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 3c. 页面淡入淡出切换 ----------
   令牌机制：快速连续切页时，只有最后一次切换生效，旧回调不会覆盖新页面 */
let screenToken=0;
function swapScreen(html,bind){
  const sc=$('#screen'), tok=++screenToken;
  const apply=()=>{ if(tok!==screenToken) return;
    sc.innerHTML=html; sc.classList.remove('fade'); if(bind) bind(); };
  if(reducedMotion()){ apply(); return; }
  sc.classList.add('fade');
  setTimeout(apply,180);
}

/* =====================================================================
   4. 内嵌音效（WebAudio 实时合成，零外部资源）
   click  普通按钮点击：短促冰蓝水滴音
   ok     编译成功：轻快上行琶音（C-E-G-C）
   crash  报错崩溃：锯齿波下坠 + 白噪声爆裂
   secret 隐藏彩蛋：星庭风铃长旋律（密令 / 隐藏结局专属）
   ===================================================================== */
const AudioFX={
  ctx:null, on:true,
  load(){ try{ this.on=localStorage.getItem(CFG.SND)!=='0'; }catch(e){} },
  set(v){ this.on=v; try{ localStorage.setItem(CFG.SND,v?'1':'0'); }catch(e){}
    const b=$('#btnSnd'); if(b){ b.textContent=v?'🔊':'🔇'; b.setAttribute('aria-pressed',String(v)); } },
  ensure(){
    if(!this.on) return null;
    if(!this.ctx){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC) this.ctx=new AC(); }catch(e){} }
    if(this.ctx&&this.ctx.state==='suspended'){ this.ctx.resume().catch(()=>{}); }
    return this.ctx;
  },
  tone(f,t0,dur,type,vol,f2){
    const c=this.ctx; if(!c) return;
    try{
      const o=c.createOscillator(), g=c.createGain(), now=c.currentTime+t0;
      o.type=type||'sine';
      o.frequency.setValueAtTime(f,now);
      if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),now+dur);
      g.gain.setValueAtTime(0.0001,now);
      g.gain.exponentialRampToValueAtTime(vol,now+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
      o.connect(g); g.connect(c.destination);
      o.start(now); o.stop(now+dur+0.05);
    }catch(e){}
  },
  noise(t0,dur,vol){
    const c=this.ctx; if(!c) return;
    try{
      const len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      const src=c.createBufferSource(), g=c.createGain(), fl=c.createBiquadFilter();
      fl.type='lowpass'; fl.frequency.value=900;
      src.buffer=buf; g.gain.value=vol;
      src.connect(fl); fl.connect(g); g.connect(c.destination);
      src.start(c.currentTime+t0);
    }catch(e){}
  },
  click(){ if(this.ensure()) this.tone(760,0,.06,'sine',.10,520); },
  ok(){ if(this.ensure()) [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,i*.07,.16,'triangle',.12)); },
  crash(){ if(this.ensure()){ this.tone(220,0,.4,'sawtooth',.16,55); this.tone(110,.05,.35,'square',.07,40); this.noise(.02,.3,.10); } },
  secret(){ if(this.ensure()){
    [659.25,783.99,987.77,1318.5,1174.66,1567.98,2093].forEach((f,i)=>this.tone(f,i*.09,.22,'triangle',.11));
    this.tone(2637,.66,.5,'sine',.06);
  } }
};

/* =====================================================================
   5. 星野背景（Canvas 装饰层）
   单 rAF 循环驱动；DPR 封顶 2；页面隐藏时自动暂停；
   prefers-reduced-motion 时只画一帧静态星空。
   ===================================================================== */
const Stars={
  cv:null,cx:null,list:[],meteor:null,nextMeteor:0,raf:0,W:0,H:0,
  init(){
    this.cv=$('#stars'); if(!this.cv||!this.cv.getContext) return;
    this.cx=this.cv.getContext('2d');
    this.resize();
    addEventListener('resize',()=>this.resize());
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){ cancelAnimationFrame(this.raf); this.raf=0; }
      else if(!reducedMotion()) this.loop();
    });
    if(reducedMotion()){ this.draw(0); return; }
    this.loop();
  },
  resize(){
    const dpr=Math.min(2,devicePixelRatio||1);
    this.W=innerWidth; this.H=innerHeight;
    this.cv.width=this.W*dpr; this.cv.height=this.H*dpr;
    this.cv.style.width=this.W+'px'; this.cv.style.height=this.H+'px';
    this.cx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(200,Math.floor(this.W*this.H/9000));
    this.list=Array.from({length:n},()=>({
      x:Math.random()*this.W, y:Math.random()*this.H,
      r:Math.random()*1.3+.3, p:Math.random()*Math.PI*2,
      s:.4+Math.random()*1.2,
      c:pick(['#9fd4ff','#eaf0ff','#b9a5ff','#ffd479'])
    }));
    if(reducedMotion()) this.draw(0);
  },
  draw(t){
    const c=this.cx; if(!c) return;
    c.clearRect(0,0,this.W,this.H);
    for(const s of this.list){
      const a=.25+.55*(.5+.5*Math.sin(t*.001*s.s+s.p));
      c.globalAlpha=a; c.fillStyle=s.c;
      c.beginPath(); c.arc(s.x,s.y,s.r,0,6.283); c.fill();
    }
    /* 流星：每 6~12 秒一颗，斜划过星空 */
    if(this.meteor){
      const m=this.meteor;
      c.globalAlpha=Math.max(0,m.life); c.strokeStyle='#9fd4ff'; c.lineWidth=1.4;
      c.beginPath(); c.moveTo(m.x,m.y); c.lineTo(m.x-m.vx*9,m.y-m.vy*9); c.stroke();
      m.x+=m.vx; m.y+=m.vy; m.life-=.016;
      if(m.life<=0||m.x>this.W+80||m.y>this.H+80) this.meteor=null;
    }else if(t>this.nextMeteor){
      this.meteor={x:Math.random()*this.W*.6,y:Math.random()*this.H*.3,vx:5+Math.random()*3,vy:2.4+Math.random()*1.6,life:1};
      this.nextMeteor=t+6000+Math.random()*6000;
    }
    c.globalAlpha=1;
  },
  loop(){
    if(this.raf) return;                     /* 防止重复起循环 */
    const step=t=>{ this.draw(t); this.raf=requestAnimationFrame(step); };
    this.raf=requestAnimationFrame(step);
  }
};

/* =====================================================================
   6. 引擎运行时状态
   ===================================================================== */
let S=null, tickId=null;
let MODE='single', LBTAB='single';   /* 模式选择 / 榜单页签（纯 UI 状态） */

function newState(name,mode){

function scaleOf(r){ return {dmg:[1,1.18,1.35][r-1]||1.35, sec:[7,6,5][r-1]||5, luck:r}; }

/* ---------- 6b. 本局履历 ---------- */
function hist(kind,txt,sub){
  if(!S||!S.hist) return;
  S.hist.push({k:kind,t:txt,s:sub||'',at:fmtTime(Date.now()-S.t0)});
}

/* ---------- 6c. 局内进度存档 ----------
   存档点 = 每关入口（render 完成时）+ 法宝使用 / 局间调息。
   结算页退出后读档会回到当前关入口重答本关——语义清晰，不会重复计分。
   终局（finish）与重置时存档即删，首页只在有档时显示「继续上局」。 */
function saveRun(phase){
  if(!S||S.over) return;
  try{
    const snap=structuredClone(Object.assign({},S,{timer:null,compileT:null}));
    lsSet(CFG.SAVE,{v:1,phase:phase||'play',s:snap});
  }catch(e){}
}
function readRun(){
  const r=lsGet(CFG.SAVE,null);
  if(!r||!r.s||!Array.isArray(r.s.queue)||!r.s.queue.length) return null;
  if(typeof r.s.qi!=='number'||r.s.qi<0) return null;
  /* break 存档时 qi 已走到队尾（== length），属合法状态；play 存档必须在队内 */
  if(r.phase==='break'){ if(r.s.qi>r.s.queue.length) return null; }
  else if(r.s.qi>=r.s.queue.length) return null;
  if(!(r.s.hp>0)||r.s.over) return null;
  return r;
}
function clearRun(){ lsDel(CFG.SAVE); }

/* ---------- 6d. 造关：随机生成一局 ----------
   单局：五大天劫各 2 题 + 内存劫 1 题 + 心魔签 2 支 + 祭祀 + 调息
         + 二重天劫 4 抽 2 + 三重终局 + 随机心情事件，全程 22+ 关；
   赛季：每劫 1 题的经典节奏 ×3 局，雷劫逐局加强。
   队列线性推进：render → resolve → advance，没有任何条件跳转分支。 */
function buildQueue(round){
  round=round||1;
  S.scale=scaleOf(round);
  const perCat=(S.mode==='single')?2:1;
  let nodes=[];
  ['hdr','nul','wild','loop','fmt'].forEach(c=>{
    shuffle(POOL[c]).slice(0,perCat).forEach(p=>nodes.push(structuredClone(p)));
  });
  nodes.push(structuredClone(pick(POOL.mem)));
  nodes=shuffle(nodes);
  /* 抽签占位节点用中性牌堆文案，抽签结果在 draw 时写回队列（存档一致性） */
  const luckCard={kind:'luck',cat:'心魔劫',title:'心魔签 · 今晚躲得过哪一劫',
    body:'牌堆里混着全角分号、<code>mian</code> 函数、陈旧的 <code>.o</code>、AI 递来的 C++ 头文件、室友的电源……<b>抽一支。</b>'};
  const luckN=S.scale.luck+(S.mode==='single'?1:0);
  for(let i=0;i<luckN;i++) nodes.splice(1+rnd(nodes.length-1),0,Object.assign({},luckCard));
  nodes.unshift({kind:'stash',title:round>1?('山门前 · 第 '+round+' 局补给'):'山门前 · 领取法宝',
    body:round>1?('雷劫加强：<b>掉血 ×'+S.scale.dmg+'、限时 '+S.scale.sec+' 秒、心魔签 '+S.scale.luck+' 支</b>。再领一件家伙。')
      :'渡劫前先挑一件趁手家伙。<b>一人限带三件</b>，选好了就走。'});
  nodes.splice(1,0,structuredClone(POOL.bless));   /* 山门祭祀固定第 2 关 */
  nodes.push(structuredClone(POOL.rest));          /* 中场调息 */
  shuffle(POOL.mid).slice(0,2).forEach(b=>nodes.push(structuredClone(b)));
  POOL.boss.forEach(b=>nodes.push(structuredClone(b)));   /* 终局三连 */
  /* 心情事件：约 75% 概率插入 1~2 个，避开首两关与终局三关，同局不重复 */
  const moodN=Math.random()<0.75?(Math.random()<0.3?2:1):0;
  const moodPool=shuffle(POOL.mood.slice());
  for(let i=0;i<moodN;i++){
    const pos=2+rnd(nodes.length-6);
    nodes.splice(pos,0,structuredClone(moodPool[i]));
  }
  /* debuff 可见性兜底：没抽到 m4/m5 时 80% 概率补一张 */
  if(!nodes.some(n=>n.kind==='mood'&&(n.id==='m4'||n.id==='m5'))&&Math.random()<0.8){
    const pos=2+rnd(nodes.length-6);
    nodes.splice(pos,0,structuredClone(pick(POOL.mood.filter(m=>m.id==='m4'||m.id==='m5'))));
  }
  return nodes;
}

function fmtTime(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function mult(){ return 1+Math.min(S.combo,6)*0.18; }

/* =====================================================================
   7. BUFF 引擎
   left = 包括当前关在内还剩几关生效。resolve 结算时：
   先吃 buff 效果 → tickBuffs 递减 → 再授予新 buff。
   「接下来 3 关」正好生效 3 关，「护体」必定挡到下一次伤害。
   ===================================================================== */
function grantBuff(b){
  if(!S||!b||!b.id) return;
  S.buffs=S.buffs.filter(x=>x.id!==b.id);   /* 同名只保留最新一次 */
  S.buffs.push({id:b.id,left:b.left||1});
  const meta=BUFFS[b.id];
  hist('buff','获得「'+(meta?meta.n:b.id)+'」',meta?meta.d:'');
}
function buffGet(id){ return S?S.buffs.find(b=>b.id===id):null; }
function tickBuffs(){
  if(!S||!S.buffs.length) return;
  S.buffs.forEach(b=>{ b.left--; });
  S.buffs=S.buffs.filter(b=>b.left>0);
}

    const it=POOL.stash.find(s=>s.id===id); if(!it) return;

  });

    bb.innerHTML=S.buffs.length
      ? S.buffs.map(b=>'<span class="chip" title="'+esc(BUFFS[b.id]?BUFFS[b.id].d:'')+'">✨ '+esc(BUFFS[b.id]?BUFFS[b.id].n:b.id)+(b.left>=99?' · 全程':' ×'+b.left)+'</span>').join('')
      : '';

  updateFoot();
}

/* 密令解锁：全屏星屑迸发 */
function starBurst(){
  if(reducedMotion()) return;
  const cx=innerWidth/2, cy=innerHeight/2;
  for(let i=0;i<26;i++){
    const s=document.createElement('span');
    s.className='spark'; s.textContent=pick(['✦','✧','⋆','＊']);
    const ang=Math.random()*Math.PI*2, d=70+Math.random()*160;
    s.style.left=cx+'px'; s.style.top=cy+'px';
    s.style.setProperty('--dx',Math.cos(ang)*d+'px');
    s.style.setProperty('--dy',Math.sin(ang)*d+'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1200);
  }
}

const toastQ=[];
function pop(txt){ toastQ.push(txt); pumpToast(); }
function pumpToast(){
  const n=document.querySelectorAll('.pop').length;
  if(n>=3||!toastQ.length) return;
  const d=document.createElement('div'); d.className='pop'; d.textContent=toastQ.shift();
  d.style.top=(74+n*42)+'px';
  document.body.appendChild(d);
  setTimeout(()=>{ d.remove(); pumpToast(); },1600);
  pumpToast();
}

  ).join('')+'</pre>';
}

/* 清掉本关全部计时资源：限时器 + 编译动画定时器（切页/读档/重置都会调用） */
function clearTimer(){
  if(!S) return;
  if(S.timer){ clearInterval(S.timer); S.timer=null; }
  if(S.compileT){ clearTimeout(S.compileT); S.compileT=null; }
}

function startTimer(sec,expire){
  if(!S) return;
  if(S.timer){ clearInterval(S.timer); S.timer=null; }
  let left=sec*10;
  const el=$('#tlBar'), tx=$('#tlTxt');
  if(el) el.style.width='100%';
  if(tx) tx.textContent=sec.toFixed(1)+'"';
  S.timer=setInterval(()=>{
    left--;
    if(el) el.style.width=Math.max(0,left/(sec*10)*100)+'%';
    if(tx) tx.textContent=(left/10).toFixed(1)+'"';
    if(left<=0){ clearTimer(); expire(); }
  },100);
}

/* compiling... 编译加载动画：
   进入报错分支时先播放 ~0.75s 的编译进度，选项置灰不可点，
   完成后报错闪烁显现、选项解禁、限时题此刻才开始倒计时。
   点击进度块可跳过；reduced-motion 用户直接跳过。 */
function beginCompile(node,startAfter){
  const done=()=>{
    if(!S||S.node!==node||!S.compiling) return;   /* 幂等 + 节点一致性校验 */
    S.compiling=false;
    if(S.compileT){ clearTimeout(S.compileT); S.compileT=null; }
    const cmp=$('#cmp'); if(cmp) cmp.remove();
    const err=$('#errPre'); if(err){ err.classList.remove('hidden'); err.classList.add('flash'); }
    const ob=$('#optsBox'); if(ob) ob.classList.remove('veil');
    const tl=$('#tlineBox'); if(tl) tl.classList.remove('veil');
    $('#stage').classList.remove('compiling');
    if(startAfter) startAfter();
  };
  S.compiling=true;
  $('#stage').classList.add('compiling');
  const cmp=$('#cmp'); if(cmp) cmp.onclick=done;
  S.compileT=setTimeout(done,reducedMotion()?0:750);
}

/* =====================================================================
   10. 法宝
   ===================================================================== */
function useItem(i){
  /* 只允许在答题相位使用（结算后/编译中不可用，避免规则歧义） */
  if(!S||!FSM.is('play')||S.locked||S.compiling) return;
  const id=S.items[i]; if(!id) return;
  const used=()=>{ S.itemsUsed++; checkAch('item'); saveRun('play'); };
  if(id==='coffee'){
    S.items.splice(i,1); S.hp=clamp(S.hp+30,0,CFG.hp);
    pop('☕ 灵力 +30'); hist('item','用了 ☕ 续命咖啡','灵力 +30'); AudioFX.ok(); used(); updateHud(); return;
  }
  if(id==='duck'){
    const cand=duckTargets();
    if(!cand.length){ pop('🦆 小黄鸭沉默了：这题没有多余选项'); return; }
    S.items.splice(i,1); S.usedHint=true;
    const k=pick(cand), el=$('#opt-'+k);
    if(el) el.classList.add('out');
    pop('🦆 小黄鸭替你否掉了一个念头'); hist('item','用了 🦆 渡劫小黄鸭','排除一个错误选项'); used(); updateHud(); return;
  }
  if(id==='mirror'){
    const k=rightDisp();
    if(k<0){ pop('🪞 镜中无相：这一关没有标准答案'); return; }
    S.items.splice(i,1); S.usedHint=true; S.dao=clamp(S.dao+8,0,CFG.dao);
    const el=$('#opt-'+k); if(el) el.classList.add('right');
    pop('🪞 正确的一剑显现了（道心 +8）'); hist('item','用了 🪞 gdb 照妖镜','正解发光 · 道心 +8'); used(); updateHud(); return;
  }
}
function optsOf(){ return (S.node&&S.node.opts)?S.node.opts:[]; }
/* 选项渲染时乱序：DOM 的 opt-i 是显示序号，法宝必须换算，否则照妖镜照错人 */
function disp(orig){ const o=S.node&&S.node._order; return o?o.indexOf(orig):-1; }
function rightDisp(){ const r=optsOf().findIndex(o=>o.good); return r<0?-1:disp(r); }
function duckTargets(){
  const r=optsOf().findIndex(o=>o.good); if(r<0||optsOf().length<4) return [];
  const out=[]; optsOf().forEach((o,i)=>{ if(i!==r&&!o.good){ const d=disp(i); if(d>=0) out.push(d); } });
  return out.length>1?out:[];
}

/* =====================================================================
   11. 单关结算 resolve —— 数值结算的唯一入口
   fx = 选项效果对象；oi = 原始选项序号（乱序显示不影响记录），
   特殊值：'timeout' 超时 / 'spot:0|1' 找茬。
   ===================================================================== */
function resolve(fx,oi){
  if(!S||!FSM.is('play')||S.locked||S.compiling) return;
  S.locked=true; clearTimer();
  const node=S.node, res={hp:0,dao:0,merit:0,good:false,cls:'warn',msg:''};
  Object.assign(res,fx);
  /* debuff 熬夜困意：点对也有 30% 概率手滑点错（找茬/心情/终局不生效） */
  let flipped=false;
  if(res.good&&buffGet('sleepy')&&node.kind!=='boss'&&node.kind!=='mood'&&node.kind!=='spot'
     &&Array.isArray(node.opts)&&Math.random()<0.3){
    const bad=node.opts.map((o,i)=>i).filter(i=>!node.opts[i].good);
    if(bad.length){
      const wi=pick(bad);
      fx=Object.assign({},node.opts[wi]);   /* 复制副本，绝不动原节点数据 */
      fx.msg='😵 <b>熬夜困意</b>：眼皮一沉，你点错了选项……<br>'+(fx.msg||'');
      oi=wi; flipped=true;
      res.good=false;                        /* 错误选项没有 good 字段，必须显式清零 */
      Object.assign(res,fx);
    }
  }
  /* 天雷伤害管线：赛季放大 → 雷云 ×1.4 → 图灵 ×0.75 */
  if(res.hp<0&&S.scale.dmg!==1) res.hp=-Math.round(-res.hp*S.scale.dmg);
  if(res.hp<0&&buffGet('grump')) res.hp=-Math.round(-res.hp*1.4);
  if(res.hp<0&&buffGet('turing')) res.hp=-Math.round(-res.hp*0.75);
  /* 玄学加持 / 图灵之光：答错 20% 概率免伤（连击照断、错题照记；终局/找茬/超时不生效） */
  if(!res.good&&(buffGet('bless')||buffGet('turing'))&&node.kind!=='boss'&&node.kind!=='spot'&&oi!=='timeout'&&Math.random()<0.2){
    res.hp=Math.max(0,res.hp||0); res.dao=Math.max(0,res.dao||0);
    const who=buffGet('turing')?'图灵之光':'玄学加持';
    res.msg='🕯 <b>'+who+'</b>：报错被编译器无视，程序照常通过——这一劫不挨天雷。<br>'+(res.msg||'');
  }
  /* 编译护体先烧，Stack 神符后烧，二者共存不浪费 */
  if(res.hp<0&&buffGet('shield')){
    const bi=S.buffs.findIndex(b=>b.id==='shield');
    if(bi>=0) S.buffs.splice(bi,1);
    res.hp=0; pop('🛡 编译护体挡下了这记天雷');
  }
  if(res.hp<0){
    const ti=S.items.indexOf('talisman');
    if(ti>=0){ S.items.splice(ti,1); pop('📜 Stack 神符燃烧，伤害被吞掉了'); res.hp=0; }
  }
  if(res.good){
    S.mis=0;
    let gain=Math.round(res.merit*mult());          /* 连击倍率 */
    if(buffGet('cheer')) gain=Math.round(gain*1.25);/* 心情大好 */
    if(buffGet('von')) gain=Math.round(gain*1.25);  /* 冯氏之福 */
    const lv=lvOf(node);                            /* 品级加成 */
    if(lv===2) gain=Math.round(gain*1.1);
    else if(lv>=3) gain=Math.round(gain*1.2);
    if(buffGet('grind')) res.hp=(res.hp||0)+2;      /* 加把劲 */
    const si=S.items.indexOf('save');               /* Ctrl+S 护心镜 */
    if(si>=0){ S.items.splice(si,1); gain*=2; pop('⚡ Ctrl+S 护心镜碎裂，功德 ×2'); }
    S.merit+=gain; S.combo++; res.merit=gain;
    S.hp=clamp(S.hp+(res.hp||0),0,CFG.hp);
    S.dao=clamp(S.dao+(res.dao||0),0,CFG.dao);
  }else{
    S.combo=0; S.mis++; S.wrongTotal++;
    S.merit=Math.max(0,S.merit+(res.merit||0));
    S.hp=clamp(S.hp+(res.hp||0),0,CFG.hp);
    S.dao=clamp(S.dao+(res.dao||0),0,CFG.dao);
    /* 心魔反噬：连错三次额外扣灵力（走火入魔结局的触发来源） */
    const pen=Math.round(9*S.scale.dmg);
    if(S.mis%3===0){ S.hp=clamp(S.hp-pen,0,CFG.hp); S.dao=clamp(S.dao-5,0,CFG.dao);
      res.hp=(res.hp||0)-pen; pop('😈 心魔反噬 · 连错 '+S.mis+' 次'); }
    recordWrong(node,oi);
    hist('wrong',(oi==='timeout'?'超时未答：':'答错：')+(node.title||''),node.cat||'');
  }
  /* 路径记录（隐藏结局判定全靠它） */
  S.log.push({id:node.id||'',cat:node.cat||'',oi:(oi===undefined?-1:oi),good:!!res.good});
  /* 先让本关吃当前 buff，再递减旧 buff，最后授予新 buff */
  tickBuffs();
  if(fx.buff) grantBuff(fx.buff);
  /* 跨局成就计数（手滑点错不算主动玄学/甩锅） */
  if(!flipped&&typeof oi==='number'&&XUANXUE[node.id]===oi) addStat('xuanxue',1);
  if(!flipped&&typeof oi==='number'&&SHUAGUO[node.id]===oi) addStat('shuaiguo',1);
  if(!res.good&&(node.cat==='段劫'||node.cat==='指针劫')) addStat('ptr',1);
  if(node.kind==='mood') addStat('mood',1);
  if(res.cls) node._cls=res.cls;
  /* 图鉴收录 + 履历 */
  if(node.dex) node.dex.forEach(d=>{
    if(DEX[d]&&!S.dex[d]){ S.dex[d]=1; hist('err','收录报错「'+((DEXINFO[d]||{}).n||DEX[d])+'」',(DEXINFO[d]||{}).k||''); }
  });
  updateHud();
  checkAch('resolve');
  /* 反馈：音效 + 震屏 */
  if(res.good) AudioFX.ok();
  else if(res.cls==='bad') AudioFX.crash();
  else AudioFX.click();
  if(res.hp<0){ const w=$('#wrap'); w.classList.add('shake'); setTimeout(()=>w.classList.remove('shake'),400); }
  showRes(res);
}

/* ---------- 11b. 结算条 ---------- */
function nextLabel(){
  const nx=S.queue[S.qi+1];
  if(!nx) return '推开天门 · 看结算 →';
  if(nx.kind==='boss'&&S.node.kind!=='boss') return '⚡ 直面最终雷劫 →';
  if(nx.kind==='mid') return '⚔️ 闯入二重天劫 →';
  if(nx.kind==='rest') return '🧘 中场调息 →';
  if(nx.kind==='bless') return '🕍 山门祭祀 →';
  return '继续渡劫 →';
}
function showRes(res){
  if(!FSM.go('result')) return;
  const d=[];
  if(res.hp)  d.push('<span class="'+(res.hp>0?'up':'down')+'">灵力 '+(res.hp>0?'+':'')+res.hp+'</span>');
  if(res.dao) d.push('<span class="'+(res.dao>0?'up':'down')+'">道心 '+(res.dao>0?'+':'')+res.dao+'</span>');
  if(res.merit) d.push('<span class="up">功德 '+(res.merit>0?'+':'')+res.merit+'</span>');
  if(!res.good&&S.combo===0) d.push('<span class="neu">连击断了</span>');
  const tag=res.cls==='ok'?'✓ 渡劫成功':(res.cls==='bad'?'✗ 天雷灌顶':'△ 勉强过关');
  $('#screen').insertAdjacentHTML('beforeend',
    '<div class="res '+(res.cls||'warn')+'" id="resBox"><span class="tag">'+tag+'</span>'+
    (res.msg||'')+'<div class="delta">'+(d.join('')||'<span class="neu">无事发生</span>')+'</div>'+
    '<button class="next" id="go" type="button">'+nextLabel()+'</button></div>');
  const g=$('#go'); g.onclick=advance; g.focus({preventScroll:true});
  g.scrollIntoView({block:'nearest'});
  /* 灵力归零：稍作停顿让玩家看清致命一击，再进终局（状态机校验防重复触发） */
  if(S.hp<=0) setTimeout(()=>{ if(FSM.is('result')&&S&&!S.over&&S.hp<=0) endGame('dead'); },500);
}

/* ---------- 11c. 推进（唯一跳转出口） ---------- */
function advance(){
  if(!S||!FSM.is('result')||!S.locked||S.over) return;   /* 防跳关 / 防重复结算 */
  clearTimer();
  if(S.hp<=0) return endGame('dead');
  S.qi++;
  if(S.qi>=S.queue.length) return endGame('win');
  render(S.queue[S.qi]);
}

/* =====================================================================
   12. 关卡渲染 render
   ===================================================================== */
function render(node){
  if(!FSM.go('play')) return;
  clearTimer();
  S.locked=true;             /* 淡出期间旧按钮一律失效，bind 完成后才解锁 */
  S.compiling=false;
  S.node=node;
  S.atBoss=(node.kind==='boss');
  updateHud();
  const errHtml=node.err?'<pre class="err hidden" id="errPre">'+node.err+'</pre>':'';
  /* 命令行统一由 CSS ::before 补 "$ " 前缀，先剥掉数据里自带的，避免显示 "$ $" */
  const cmdText=(node.cmd||'gcc main.c -o main').replace(/^\$\s*/,'');
  const term=(node.err||node.code)
    ?'<div class="term"><div class="cmd">'+esc(cmdText)+'</div>'+
      (node.code?codeHtml(node,node.kind==='spot'):'')+
      '<div class="cmp" id="cmp" title="点击跳过编译动画"><div class="cl"><span class="spin"></span><span>compiling<span class="dots"></span></span></div>'+
      '<div class="cbar"><i></i></div><div class="cs"><span>cc1 -quiet main.c · as · ld</span><span>点击跳过 ▸</span></div></div>'+
      errHtml+'</div>'
    :'';
  /* 品级徽章（图灵之光降档时显示 原→新） */
  const lvRaw=node.lv||LVDF[node.cat]||1, lvEff=lvOf(node);
  const lvBadge=['choice','timed','spot','mid','boss'].includes(node.kind)
    ? '<span class="chip lv" title="题目难度：三品功德 ×1.2 / 二品 ×1.1 / 一品 ×1.0">'+LVN[lvEff]+
      (lvEff!==lvRaw?'<i>←'+LVN[lvRaw]+'</i>':'')+'</span>'
    : '';
  let inner='<h1 class="tt card"><small>☁ '+esc(node.cat||'心魔劫')+'</small>'+esc(node.title)+lvBadge+'</h1>'+
    (node.body?'<p class="body card">'+node.body+'</p>':'')+term;
  let timedSec=0;
  if(node.kind==='stash'){
    node._picks=shuffle(POOL.stash).slice(0,3);
    inner+='<div class="opts" id="optsBox">'+node._picks.map((it,i)=>
      '<button class="opt" data-item="'+it.id+'" type="button"><span class="k">'+(i+1)+'</span>'+esc(it.n)+
      '<br><span style="color:var(--dim);font-size:12px">'+esc(it.d)+'</span></button>').join('')+'</div>';
  }else if(node.kind==='luck'){
    inner+='<div class="opts" id="optsBox"><button class="opt" id="draw" type="button"><span class="k">🎲</span>抽一支心魔签</button></div>';
  }else if(node.kind==='spot'){
    inner+='<p class="hintline">👆 点一下你认为是元凶的那行代码</p>';
  }else if(Array.isArray(node.opts)){
    if(node.kind==='timed'){
      timedSec=Math.min(node.sec,S.scale.sec);
      if(buffGet('zen')) timedSec=Math.min(15,timedSec+3);
      if(buffGet('turing')) timedSec=Math.min(15,timedSec+2);
      node._sec=timedSec;
      inner+='<div class="tline veil" id="tlineBox"><span>⏳ 限时</span><div class="track"><i id="tlBar" style="background:linear-gradient(90deg,#ffd479,#ff7b9c)"></i></div><em id="tlTxt">'+timedSec.toFixed(1)+'"</em></div>';
    }
    const order=shuffle(node.opts.map((_,i)=>i));
    node._order=order;
    inner+='<div class="opts veil" id="optsBox">'+order.map((oi,i)=>{
      const o=node.opts[oi];
      return '<button class="opt'+(node.kind==='boss'?' danger':'')+'" data-o="'+i+'" id="opt-'+i+'" type="button">'+
        '<span class="k">'+(i+1)+'</span>'+esc(o.t)+
        (o.buff?'<br><span style="color:var(--gold);font-size:11.5px">→ buff：'+esc(BUFFS[o.buff.id]?BUFFS[o.buff.id].n:o.buff.id)+'（'+esc(BUFFS[o.buff.id]?BUFFS[o.buff.id].d:'')+'）</span>':'')+
        '</button>';
    }).join('')+'</div>'+
    (node.kind==='boss'?'<p class="hintline">⚡ 终局三问，选择更重，掉血也更狠</p>':'');
  }else{
    /* 防御兜底：未知节点类型直接给出继续按钮，绝不产生死节点 */
    inner+='<div class="opts" id="optsBox"><button class="next" id="skipNode" type="button">继续渡劫 →</button></div>';
  }
  const needCompile=!!node.err&&node.kind!=='stash'&&node.kind!=='luck';
  swapScreen('<div>'+inner+'</div>',()=>{
    if(S.node!==node) return;   /* 页面已被更新的切换取代 */
    const st=$('#stage');
    /* --- 事件绑定（全部带节点一致性校验，旧 DOM 不可能触发新关结算） --- */
    st.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{
      if(S.locked||S.node!==node||S.compiling) return;
      S.locked=true;
      const id=b.dataset.item; S.items.push(id);
      const it=POOL.stash.find(s=>s.id===id);
      hist('item','领了法宝 '+it.n,it.d);
      updateHud();
      showRes({hp:id==='coffee'?12:0,dao:2,merit:4,good:false,cls:'ok',
        msg:'收进法宝袋：<b>'+esc(it.n)+'</b>。'+esc(it.d)+'<br><span class="n">（随时点上方法宝名字使用，神符与护心镜会自动燃烧）</span>'});
    });
    const dw=$('#draw');
    if(dw) dw.onclick=()=>{
      if(S.locked||S.node!==node||S.compiling) return;
      AudioFX.click();
      /* 熬夜困意：抽签一半概率换成野指针签池；抽到的签写回队列，存档/进度一致 */
      const pool=(buffGet('sleepy')&&POOL.night&&POOL.night.length&&Math.random()<0.5)?POOL.night:POOL.luck;
      const ev=structuredClone(pick(pool));
      ev.kind='choice'; ev.cat=ev.cat||'心魔劫';
      S.queue[S.qi]=ev;
      render(ev);
    };
    st.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{
      if(S.locked||S.node!==node||S.compiling) return;
      const i=+b.dataset.row;
      node._picked=i;
      resolve(i===node.right?node.win:node.lose,'spot:'+(i===node.right?1:0));
    });
    st.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
      if(S.locked||S.node!==node||S.compiling) return;
      const i=+b.dataset.o;
      resolve(node.opts[node._order[i]],node._order[i]);
    });
    const sk=$('#skipNode');
    if(sk) sk.onclick=()=>{ if(S.node===node&&!S.locked){ S.locked=true;
      showRes({hp:0,dao:0,merit:0,good:false,cls:'warn',msg:'此劫无相，径直走过。'}); } };
    /* --- 解锁输入 & 编译动画 & 限时器 --- */
    S.locked=false;
    const startTimed=()=>{
      if(node.kind==='timed'){
        startTimer(node._sec,()=>{
          if(S.locked||S.node!==node) return;
          resolve({hp:-10,dao:-8,merit:0,good:false,cls:'bad',
            msg:'<b>时间到了。</b>编译器不会等你，评测机更不会。<br>这一题按"最坏情况"结算——你带着一个未解的报错走向了下一关。'},'timeout');
        });
      }
    };
    if(needCompile&&!reducedMotion()){
      beginCompile(node,startTimed);
    }else{
      /* 无编译动画：直接显现报错与选项 */
      const cmp=$('#cmp'); if(cmp) cmp.remove();
      const err=$('#errPre'); if(err) err.classList.remove('hidden');
      const ob=$('#optsBox'); if(ob) ob.classList.remove('veil');
      const tl=$('#tlineBox'); if(tl) tl.classList.remove('veil');
      startTimed();
    }
    saveRun('play');   /* 存档点：每关入口 */
  });
  window.scrollTo({top:0,behavior:reducedMotion()?'auto':'smooth'});
}

/* =====================================================================
   13. 终局 & 排行榜
   ===================================================================== */
const RANKS=[
 {m:0,  t:'练气期 · 代码能跑就行'},
 {m:200,t:'筑基期 · 见习除虫师'},
 {m:320,t:'金丹期 · 段劫自愈'},
 {m:430,t:'元婴期 · 指针主宰'},
 {m:540,t:'大乘期 · 无警告真君'}];
function rankOf(m){ let r=RANKS[0]; RANKS.forEach(x=>{ if(m>=x.m) r=x; }); return r; }

function readLB(){ const v=lsGet(CFG.LB,[]); return Array.isArray(v)?v:[]; }
/* 两榜各留前 10 再合并存储，赛季高分不会挤掉单局榜 */
function writeLB(a){
  const keep=[];
  ['single','season'].forEach(md=>{ a.filter(x=>x&&x.mode===md).slice(0,10).forEach(x=>keep.push(x)); });
  keep.sort((x,y)=>y.m-x.m||x.t-y.t);
  lsSet(CFG.LB,keep);
}
/* 本局修为 = 功德增量 + 灵力/2 + 道心/3 + 手速(封顶120) + 奖励 */
function roundTotal(how){
  const elapsed=Math.floor((Date.now()-S.t0)/1000);
  let speed=0,bonus=0;
  if(how==='win'){
    const eff=Math.max(45,elapsed);                 /* 45 秒内按 45 算，防乱点刷分 */
    speed=Math.min(120,Math.max(0,CFG.par-eff)*2);
    if(S.dao>=90) bonus+=20;
    if(S.combo>=6) bonus+=15;
  }
  const merit=S.merit-S.meritBase;
  return {merit,speed,bonus,elapsed,total:merit+Math.round(S.hp/2)+Math.round(S.dao/3)+speed+bonus};
}

function endGame(how){
  if(!S||S.finishing) return;   /* 死亡与通关可能同时触发，加锁防重复 */
  S.finishing=true; clearTimer();
  const rt=roundTotal(how); S.roundTotals.push(rt);
  if(how==='dead') return finish('dead');
  if(S.mode==='season'&&S.round<3) return enterBreak();
  finish('win');
}

/* ---------- 13b. 赛季局间调息 ---------- */
function enterBreak(){
  if(!FSM.go('break')) return;
  S.hp=clamp(S.hp+15,0,CFG.hp); S.dao=clamp(S.dao+5,0,CFG.dao);
  hist('info','渡过第 '+S.round+' 局','局间调息 · 灵力 +15 道心 +5');
  updateHud();
  saveRun('break');   /* 存档记录调息后的数值，读档不重复回血 */
  renderBreak();
}
function renderBreak(){
  const nx=scaleOf(S.round+1), acc=S.roundTotals.reduce((a,b)=>a+b.total,0);
  swapScreen(
   '<div class="hero"><div class="zh">第 '+S.round+' 局 · 渡 过</div>'+
   '<p class="sub">累计修为 '+acc+' · 灵力 '+Math.round(S.hp)+' · 道心 '+Math.round(S.dao)+'</p></div>'+
   '<div class="sect"><h3>◆ 局间调息</h3><p class="body" style="font-size:13.5px">'+
   '你靠 <code>printf("here\\n");</code> 熬过了第一更。<b>灵力 +15、道心 +5</b>。<br>'+
   '下一局雷劫加强：<b>掉血 ×'+nx.dmg+'、限时 '+nx.sec+' 秒、心魔签 '+nx.luck+' 支</b>。<br>'+
   '<span style="color:var(--dim);font-size:12px">功德与连击不清零——这就是赛季分天然更高、也真的更难的原因。</span></p></div>'+
   '<button class="next" id="go" type="button">⚡ 渡第 '+(S.round+1)+' 局 →</button>',()=>{
    const g=$('#go'); g.onclick=nextRound; g.focus({preventScroll:true});
  });
  window.scrollTo({top:0,behavior:'auto'});
}
function nextRound(){
  if(!S||!FSM.is('break')) return;
  S.finishing=false; S.locked=true; S.node=null;
  S.round++; S.meritBase=S.merit; S.t0=Date.now();
  S.queue=buildQueue(S.round); S.qi=0;
  updateHud(); render(S.queue[0]);
}

/* ---------- 13c. 终局结算页 ---------- */
function finish(how){
  if(!FSM.go('ending')) return;
  S.over=true; clearTimer(); clearRun();
  $('#hud').classList.add('hidden');
  const rts=S.roundTotals;
  const total=rts.reduce((a,b)=>a+b.total,0);
  const elapsedAll=rts.reduce((a,b)=>a+b.elapsed,0);
  const last=rts[rts.length-1];
  const verdict=how==='dead'
    ? '<b>走火入魔</b> —— 灵力耗尽，你在第 '+(S.qi+1)+' 道劫前倒下。<br><code>Program received signal SIGSEGV</code><br>你和程序一起躺下了。睡一觉，明天它还在。'
    : '<b>天门开了一线。</b><br>0 errors, 0 warnings，样例全过，你活着把作业交上去了。<br>窗外有鸟叫，屏幕上还留着一行没删的 <code>printf("here\\n");</code>';
  /* 普通结局入图鉴 + 隐藏结局判定 */
  const ends=readEnd(); ends[how]=Date.now(); lsSet(CFG.END,ends);
  const endIds=hiddenEndingOf(how)||[];
  const freshEnd=endIds.length?unlockEnd(endIds):[];
  hist('end',(how==='dead'?'结局 · 走火入魔':'结局 · 飞升半步'),
    freshEnd.length?('隐藏结局：'+freshEnd.map(id=>ENDS[id].n).join(' / ')):'总修为 '+total);
  if(freshEnd.length) AudioFX.secret();   /* 隐藏结局专属彩蛋音效 */
  /* 赛季按平均每局定段位 */
  const rankBase=(S.mode==='season'&&how!=='dead')?Math.round(total/rts.length):total;
  const r=rankOf(rankBase);
  const lb=readLB();
  lb.push({n:S.name,m:total,hp:Math.round(S.hp),t:elapsedAll,lv:r.t,
    d:new Date().toISOString().slice(0,10),mode:S.mode,rd:rts.length,
    end:freshEnd.join(',')||''});
  lb.sort((a,b)=>b.m-a.m||a.t-b.t);
  writeLB(lb);
  LBTAB=S.mode;
  const mine=lb.filter(x=>x.mode===LBTAB);
  const me=mine.findIndex(x=>x.n===S.name&&x.m===total&&x.t===elapsedAll);
  saveDex(S.dex);
  const dn=Object.keys(readDex()).length;
  checkAch('finish',{how,speed:last?last.speed:0});
  /* 观劫使天逸的结算点评 */
  const quote=how==='dead'
    ? '「灵力尽了就睡。我数过了，星庭的夜里，<b>没有哪个 bug 值得你陪它到天亮</b>。」'
    : (freshEnd.length?'「哦？你居然走到了<b>这条命运支线</b>……我把它的名字刻进星图了。」'
      :(S.wrongTotal===0?'「零失误。<b>编译器今晚记住你了</b>——这可比榜单第一名稀有。」'
        :'「交上去了就好。<b>报错不可怕，看不懂报错才可怕</b>——去错题本翻翻今晚的收获。」'));
  swapScreen(
   '<div class="hero"><div class="zh">'+(how==='dead'?'劫 数 已 尽':'飞 升 半 步')+'</div>'+
     '<p class="sub">'+esc(r.t)+(S.mode==='season'?' · 赛季 '+rts.length+'/3 局':'')+'</p></div>'+
   '<div class="sect"><div class="verdict"><span class="va"><img src="data:image/webp;base64,UklGRqojAABXRUJQVlA4WAoAAAAQAAAAvwAAvwAAQUxQSAkNAAABCYaRpESqPfCtIf+AT5EQIvo/AboCEtCvJ5I5I0XExciqw3B3l+xBnTEO5CX5gOlabxpxePxpzjmBCnarEceir+r72pdPADX/or2rxma+rbXWmDBfFvwCPGd2GBExRsZuwwN6vwCYmd1I37z3KvfeQUoxFLRtI10S/qjvG4SImIB1BqVqvQOeo1fQapO8iT2Kcix7FtvB1rsaoK3fUw5iYOsfRZvU5piimSxH03QNnpoUcxKgWL9mpfIBsqvyWnK2l0rulSLt8qrllc8qUrmibds28v83p75ARseICZgA35IkWZIk2RYhW8////Hog0f63es5IibAtyRJliRJtoUk8f+fnMoP7ll9m4nniJgAS24kCZIkidX/n7yhPGTubk9Ndp4jYgKILxl5QOUbihIppVKKEuVrSemItAd2KTWRrwM/60gRFiVFU4rU3BNfg9y6FJI+Viq1VpKKLK/5AuxcKFXCrWUiiSznVgkSnpuc2+VP95zQbluWStPcTqX1s7xtEGLDTpXU+4Hke2tozfcZ/LktQcj5SXbDpdK6ZWVaNAtLY022rLeEzO0PYnNm0o2uaX5e086rd395t53XtPujaVM3DeXHWFtjUbti9Y7eWdttt15269Wr5d14t1XsmCF1fw3WhjkkLbIbCxZM0wQLFr2snDT2h/J3sLWrrnKdjns3msxtvo4sy8jXejKtbj8rLlGpfD6bWRPOvLObLNu9hfk63/M1rHtlpdu1a4OuOp9v/8MWN+XkH87nWLY+mvaxsshn/uFm5FRTfLCN63ypuXW7U7ucdlHJ/PMIZadlR9ttY0FraPs/yrrmlB/iLE7OrexSaqdZhiytHZFd3FrazUQ9EV7/N3HN6ieJJnZyxO2QdLtZ872l3STVbqWWjFJJHsn+L9quxlSKndeSOFpyTzf6fyPq5mfJqZXMmhThQuPDzGZ2ltyop9e4JShcfzxx7YoquTUIdUvnpHU+yTFY49byOT16jtWi31i6HFf7MVOqnNvVqW6fBBtrdVrTxraV1+kXp9P1SUt1OiedoPIhmM1VO1ej3R62ee2l399fL/7o53bq5/bjbnddH3LbOFfoKs7bjP7Fs84Xh+rA9oht/wf4XzO39vM6qWjy0L+cilDJdn+yVWifN5fBrXs/U1lNsz5gV7LVVPXn3npV7H+vsUZqPdfCMvqYWUNrbm0qwWeFjf7wSV43fc5ibpPPD8XKB43GWgwjk9FnLSaD0HUO6nzOJ2tJjDe1rc8728odsSrmk/sy2dE027LRJ76wUWku5+8+glTVap1Wa6xPHd5aLalF0vwLtES3W9Y9N830yTfLznUqacTavwFpfgwJM334GfKl7V7i9+VdrWaylz59bqYqs/Labzds0w1m5NHn31ziPshrzK9iG2MyvHva1t9wtnW5YGqx8YsO22x6mHka/R1n1vXtyPv7NWN7nufZHjfzrIf+llyuEsDest+ysUuyq557OlCNc7uPzOzNfofNpmO1o6cHvil2W7y12fwGG7pWZNFWNqswja0tbN5gM7eyXlkDul3J3DJ7ne11M0a76WmYhCqGm14Y8waztSONZT36G5cgmnVrs/MibM666DVbtv7OVXZpNz3tbHnR/9GmP9dbs/7WH3TLV1vWq++SW+eyHhx4pyV7XrdkvTw/uXXK6ykx6cM+b3l6bdVV7VattSqoRayt2wE8jypppcgD9zpsk5PQ8+tDbq3YbbBPrVnnlognzdcfrZ2mjZ4rW7ud09PteY6NUphiy7+K7a4idU7Pr1h6p9E3+FMaP3JFz3Yi1XV9/xXk7+sqkfNHUsH6vMtvIZvPQaU/FBVRKb9GUkRFf+RSWEqifgsUKQ2le0w
