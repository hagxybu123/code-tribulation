/* ---------- 13d. 榜单 ---------- */
function lbTabs(){
  return '<div class="tabs"><button class="tab'+(LBTAB==='single'?' on':'')+'" data-tab="single" type="button">单局榜</button>'+
    '<button class="tab'+(LBTAB==='season'?' on':'')+'" data-tab="season" type="button">赛季三连榜</button></div>';
}
function bindLbTabs(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    LBTAB=b.dataset.tab;
    const box=$('#tabsHost'); if(box){ box.innerHTML=lbTabs(); bindLbTabs(); }
    const list=$('#lbHost'); if(list) list.innerHTML=lbHtml(readLB().filter(x=>x.mode===LBTAB),-1);
  });
}
function boardHtml(){ return '<div id="tabsHost">'+lbTabs()+'</div><div id="lbHost">'+lbHtml(readLB().filter(x=>x.mode===LBTAB),-1)+'</div>'; }
function lbHtml(lb,me){
  if(!lb.length) return '<ol class="lb"><li class="empty">此榜尚空，第一个来的就是榜一</li></ol>';
  return '<ol class="lb">'+lb.slice(0,10).map((x,i)=>
    '<li'+(i===me?' class="me"':'')+'><span class="nm">'+esc(x.n)+(i===me?'（你）':'')+
      (x.rd>1?'<span class="badge">'+x.rd+'局</span>':'')+
      (x.end?'<span style="color:var(--gold);margin-left:4px" title="解锁过隐藏结局">★</span>':'')+'</span>'+
    '<span style="color:var(--dim);font-size:11px">'+esc((x.lv||'').split(' · ')[0])+'</span>'+
    '<span style="color:var(--dim);font-size:11px">'+fmtTime((x.t||0)*1000)+'</span>'+
    '<span class="sc">'+x.m+'</span></li>').join('')+'</ol>';
}

/* =====================================================================
   14. 图鉴 / 错题本 / 成就 / 隐藏结局 的存档与判定
   ===================================================================== */
function saveDex(d){ const cur=readDex(); Object.keys(d).forEach(k=>cur[k]=1); lsSet(CFG.DEX,cur); }
function readDex(){ const v=lsGet(CFG.DEX,{}); return (v&&typeof v==='object')?v:{}; }
function readBook(){ const v=lsGet(CFG.BOOK,[]); return Array.isArray(v)?v:[]; }
function saveBook(a){ lsSet(CFG.BOOK,a.slice(0,60)); }
function readAch(){ const v=lsGet(CFG.ACH,{}); return (v&&typeof v==='object')?v:{}; }
function readEnd(){ const v=lsGet(CFG.END,{}); return (v&&typeof v==='object')?v:{}; }
function readStat(){ const v=lsGet(CFG.ACHSTAT,{}); return (v&&typeof v==='object')?v:{}; }
function addStat(k,n){ const st=readStat(); st[k]=(st[k]||0)+(n||1); lsSet(CFG.ACHSTAT,st); }

function kbOf(node){
  if(node&&node.kb) return node.kb;
  if(node&&node.dex&&node.dex.length&&DEXINFO[node.dex[0]]) return DEXINFO[node.dex[0]].k;
  return '';
}
/* 收录一条错题：真的答错且没记过才写盘 */
function recordWrong(node,oi){
  if(!node) return false;
  let wT='',rT='';
  if(node.kind==='spot'){
    wT='点错了：第 '+(typeof node._picked==='number'?(node._picked+1):'?')+' 行';
    rT='元凶是第 '+(typeof node.right==='number'?(node.right+1):'?')+' 行';
  }else if(Array.isArray(node.opts)){
    const g=node.opts.find(o=>o.good);
    rT=g?g.t:'';
    wT=(oi==='timeout')?'（超时未作答）':(typeof oi==='number'&&node.opts[oi]?node.opts[oi].t:'');
  }
  if(!wT) return false;
  const key=(node.id||'?')+'|'+((oi==='spot:0'&&typeof node._picked==='number')?('spot:'+node._picked):(typeof oi==='string'?oi:oi));
  const book=readBook();
  if(book.some(x=>x.key===key)) return false;
  book.push({key,t:String(node.title||node.id),w:wT,r:rT,k:kbOf(node),cat:node.cat||'',d:new Date().toISOString().slice(0,10)});
  saveBook(book);
  if(S&&typeof S.bookAdded==='number') S.bookAdded++;
  pop('📕 已收录错题本');
  checkAch('book');
  return true;
}

function unlockAch(a){
  if(!a) return;
  const cur=readAch();
  if(cur[a.id]) return;
  cur[a.id]=Date.now();
  lsSet(CFG.ACH,cur);
  if(S&&S.newAch) S.newAch.push(a);
  pop('🏆 成就解锁：'+a.n);
  updateFoot();
}
function checkAch(tag,ctx){
  if(!S||!S.newAch) return;
  ACH.forEach(a=>{
    if(readAch()[a.id]) return;
    const due=(a.when===tag)||(a.stat&&(tag==='resolve'||tag==='finish'));
    if(!due) return;
    let ok=false;
    try{ ok=a.cond(ctx||{}); }catch(e){ ok=false; }
    if(ok) unlockAch(a);
  });
}
function unlockEnd(ids){
  const cur=readEnd(), fresh=[];
  ids.forEach(id=>{
    if(!ENDS[id]||cur[id]) return;
    cur[id]=Date.now(); fresh.push(id);
  });
  lsSet(CFG.END,cur);
  fresh.forEach(id=>pop('✨ 隐藏结局解锁：'+ENDS[id].n));
  return fresh;
}
/* 隐藏结局判定：只读 S.log，不影响榜单与原有结局流程 */
function hiddenEndingOf(how){
  if(!S||!S.log) return null;
  const L=S.log, win=(how==='win'), ids=[];
  if(win&&S.wrongTotal===0&&!S.usedHint) ids.push('e1');                       /* 不染尘埃 */
  const boss=L.filter(x=>/^b[1-3]$/.test(x.id)).slice(-3);                     /* 逆天改命：摆烂三连 */
  if(win&&boss.length===3&&boss[0].id==='b1'&&boss[0].oi===2&&boss[1].id==='b2'&&boss[1].oi===3&&boss[2].id==='b3'&&boss[2].oi===3) ids.push('e2');
  if(!win&&S.atBoss) ids.push('e3');                                          /* 以身证道 */
  if(win&&S.wrongTotal>=5) ids.push('e4');                                    /* 百炼成仙 */
  if(win&&L.some(x=>x.id==='x8'&&x.oi===1)) ids.push('e5');                   /* 香火燎原 */
  return ids.length?ids:null;
}

     '✨ <b>隐藏结局</b> '+Object.keys(ENDS).length+' 个 + 🏆 <b>成就</b> '+ACH.length+' 枚：结局图鉴里点亮收集，还藏着一个 <code>#include</code> 暗号<br>'+
     '💾 <b>自动存档</b>：每关入口落盘，手机切后台、误关页面都能「继续上局」<br>'+
     '连击倍率最高 ×2.1；<b>想冲第一就走赛季三连</b>。键盘 1-5 速选，Enter 继续，D 翻手册。</p></div>'+
   '<div class="sect"><h3>◆ 渡劫榜</h3>'+boardHtml()+'</div>',()=>{
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
      MODE=b.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode===MODE));
    });
    $('#go').onclick=()=>{
      const name=(($('#nm').value||'').trim()||'无名散修').slice(0,10);
      try{ localStorage.setItem(CFG.NAME,name); }catch(e){}
      if(readRun()){
        confirmSheet('开始新的渡劫？','检测到还有一局未完成的进度（'+esc(readRun().s.name)+'）。开新局会<b>覆盖旧进度</b>，图鉴与成就不受影响。','⚡ 覆盖并开新局',()=>start(MODE));
      }else start(MODE);
    };
    const rs=$('#resume'); if(rs) rs.onclick=resumeRun;
    $('#dexbtn').onclick=openDex;
    $('#bookbtn').onclick=openBook;
    $('#endsbtn').onclick=openEnds;
    $('#wipe').onclick=()=>confirmSheet('清空本机全部存档？','榜单、报错手册、错题本、成就、隐藏结局、局内进度将<b>全部清零</b>，此操作不可撤销。','🗑 全部清空',()=>{
      [CFG.LB,CFG.DEX,CFG.ACH,CFG.ACHSTAT,CFG.END,CFG.BOOK,CFG.SAVE].forEach(lsDel);
      pop('已清空'); home();
    });
    bindLbTabs();
    updateFoot();
  });
  window.scrollTo({top:0,behavior:'auto'});
}

function start(mode){
  /* 道号回落 localStorage：结算页重开时输入框已不存在 */
  let name='';
  const el=$('#nm');
  if(el&&el.value) name=el.value.trim();
  if(!name){ try{ name=(localStorage.getItem(CFG.NAME)||'').trim(); }catch(e){} }
  if(mode) MODE=mode;
  clearTimer();
  S=newState(name||'无名散修',MODE);
  S.queue=buildQueue(S.round); S.qi=0;
  $('#hud').classList.remove('hidden');
  tickId=tickId||setInterval(()=>{ if(S&&!S.locked&&!S.finishing&&FSM.is('play','result','break')) updateHud(); },1000);
  updateHud(); render(S.queue[0]);
}

/* 读档续玩：恢复运行时状态，当前关从入口重新渲染（限时题重新计时） */
function resumeRun(){
  const r=readRun();
  if(!r){ pop('存档已失效'); home(); return; }
  S=r.s;
  S.timer=null; S.compileT=null; S.locked=true; S.compiling=false;
  S.finishing=false; S.over=false; S.node=null;
  if(!Array.isArray(S.hist)) S.hist=[];
  if(!Array.isArray(S.newAch)) S.newAch=[];
  MODE=S.mode;
  $('#hud').classList.remove('hidden');
  tickId=tickId||setInterval(()=>{ if(S&&!S.locked&&!S.finishing&&FSM.is('play','result','break')) updateHud(); },1000);
  updateHud();
  if(r.phase==='break'){
    if(!FSM.go('break')) return;
    S.finishing=true;   /* 与 enterBreak 后状态一致，nextRound 会复位 */
    renderBreak();
  }else{
    render(S.queue[S.qi]);
  }
  pop('⏵ 已续上第 '+Math.min(S.qi+1,S.queue.length)+' 劫');
}

/* 重置本局：二次确认 → 删进度档 → 回山门（图鉴/成就/榜单保留） */
function resetRun(){
  confirmSheet('重置本局渡劫？','本局进度将丢弃并回到山门。<b>报错手册、错题本、成就与榜单都会保留</b>。','↺ 重置本局',()=>{
    clearTimer(); clearRun(); S=null;
    home();
    pop('已重置，回山门');
  });
}

/* =====================================================================
   16. 键盘（速通友好）
   ===================================================================== */
document.addEventListener('keydown',e=>{
  /* 开场动画：任意键跳过 */
  const boot=$('#boot');
  if(boot&&!boot.classList.contains('off')){ finishBoot(); return; }
  /* 浮层打开时只响应 Esc（密令输入框的 Enter 由其自身监听处理） */
  if(sheetOpen()){
    if(e.key==='Escape'){ e.preventDefault(); closeSheet(); }
    return;
  }
  const typing=e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA');
  if(typing){ if(e.key==='Enter'){ e.preventDefault(); const g=$('#go'); if(g) g.click(); } return; }
  const k=e.key;
  if(k==='d'||k==='D'){ e.preventDefault(); openDex(); return; }
  if(/^[1-5]$/.test(k)&&FSM.is('play')&&S&&!S.compiling){
    const i=+k-1;
    const b=$('#opt-'+i)||document.querySelectorAll('.opts .opt')[i];
    if(b&&!b.classList.contains('out')){ e.preventDefault(); b.click(); }
    return;
  }
  if(k==='Enter'||k===' '){
    const g=FSM.is('play')?$('#draw'):($('#go')||$('#again')||$('#resume'));
    if(g){ e.preventDefault(); g.click(); }
    return;
  }
  if(k==='r'||k==='R'){
    if(FSM.is('ending')){ const a=$('#again'); if(a){ e.preventDefault(); a.click(); } }
  }
});

/* =====================================================================
   17. 全局事件 / 开场动画 / 启动
   ===================================================================== */
/* 普通按钮点击音效（选项按钮由结算音效接管，避免叠音） */
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('button');
  if(!b) return;
  if(b.hasAttribute('data-o')||b.hasAttribute('data-row')||b.id==='draw') return;
  AudioFX.click();
},true);

/* 顶栏常驻按钮 */
$('#btnSnd').onclick=()=>{ AudioFX.set(!AudioFX.on); if(AudioFX.on) AudioFX.ok(); };
$('#btnDex').onclick=openDex;
$('#btnEnds').onclick=openEnds;
$('#btnHist').onclick=openHist;
$('#btnReset').onclick=()=>{ if(FSM.is('play','result','break')) resetRun(); };
/* 遮罩点击空白处关闭浮层 */
$('#ovl').addEventListener('click',e=>{ if(e.target.id==='ovl') closeSheet(); });

/* ---------- 开场加载动画 ---------- */
let bootDone=false;
function finishBoot(){
  if(bootDone) return;
  bootDone=true;
  const boot=$('#boot');
  boot.classList.add('off');
  FSM.go('home');
  home();
  setTimeout(()=>boot.remove(),600);
}
function runBoot(){
  const bar=$('#bootBar'), line=$('#bootLine'), boot=$('#boot');
  boot.addEventListener('click',finishBoot);
  if(reducedMotion()){ setTimeout(finishBoot,150); return; }
  setTimeout(()=>{ bar.style.width='46%'; },120);
  setTimeout(()=>{ bar.style.width='78%'; line.innerHTML='linking<span class="dots"></span>'; },620);
  setTimeout(()=>{ bar.style.width='100%'; line.innerHTML='<span class="ok">0 errors, 0 warnings</span> · ./future ▸ 星庭已开'; },1150);
  setTimeout(finishBoot,1750);
}

/* ---------- 启动 ---------- */
AudioFX.load();
AudioFX.set(AudioFX.on);   /* 同步按钮图标与 aria 状态 */
Stars.init();
runBoot();
</script>

<!-- =====================================================================
     ✅✅ 新增代码块 ②（JS）：自动主题 + 状态 BGM + 重置连击彩蛋
     ------------------------------------------------------------------
     · 独立 IIFE，全部只读监听原有全局（S / CFG / FSM / AudioFX / updateHud），
       不修改、不重构上方任何一行原有 JS；
     · 整块删除后，游戏照原样运行（零耦合）。
     ===================================================================== -->
<script>
(function(){
'use strict';

/* ---------- 引用原有全局（只读） ---------- */
var CFGx=(typeof CFG!=='undefined')?CFG:null;
var FSMx=(typeof FSM!=='undefined')?FSM:null;
var AFx =(typeof AudioFX!=='undefined')?AudioFX:null;
function Snow(){ try{ return (typeof S!=='undefined')?(S||null):null; }catch(e){ return null; } }
function toast(t){ try{ if(typeof pop==='function') pop(t); }catch(e){} }
var root=document.documentElement;

/* =====================================================================
   A. 参数区：想调手感只改这里
   ===================================================================== */
var AUTO_THEME={
  /* —— 阈值：由 灵力 / 道心 / 连对数(combo) / 连错数(mis) 推导心境 —— */
  crash:{hp:0.25, dao:0.25, mis:3},   /* 走火入魔：血或道心 ≤25%，或连错 ≥3 */
  storm:{hp:0.60, dao:0.60, mis:2},   /* 雷云压顶：血或道心 <60%，或连错 ≥2 */
  bright:{combo:3, hp:0.80, dao:0.80},/* 心境通明：连对 ≥3 且血线健康 → 浅色 */
  dwell:1000,        /* 切换冷却 ms（crash 无视冷却，立刻变红） */
  poll:500,          /* 兜底轮询 ms（主链路由 updateHud 包装驱动） */
  /* —— 彩蛋：连续快速点击「↺ 重置」need 次 —— */
  egg:{need:5, gap:900, hold:420}
};

/* 心境 → 深/浅底 + 文案 */
var THEME_OF={crash:'dark', storm:'dark', calm:'dark', bright:'light'};
var LABEL={
  crash:'💥 走火入魔',
  storm:'⛈ 雷云压顶',
  bright:'✨ 心境通明 · 浅色',
  calm:'🌌 星庭 · 常态'
};

/* =====================================================================
   B. BGM：WebAudio 实时合成，复用原有 AudioFX.tone/noise 原语
      （跟着 AudioFX.on 走：顶栏 🔇 关掉，BGM 自动静音）
   ===================================================================== */
var PATT={
  calm:  {step:.42,dur:.60,type:'sine',    vol:.026, seq:[220.00,0,261.63,0,293.66,0,261.63,329.63], bass:110.00,bdiv:4,bdur:1.30,bvol:.020},
  bright:{step:.26,dur:.40,type:'triangle',vol:.030, seq:[523.25,587.33,659.25,783.99,0,659.25,880.00,0], bass:130.81,bdiv:4,bdur:1.00,bvol:.022},
  storm: {step:.31,dur:.52,type:'sawtooth',vol:.020, seq:[146.83,0,174.61,0,220.00,196.00,0,174.61],     bass:73.42, bdiv:4,bdur:1.10,bvol:.022},
  crash: {step:.22,dur:.34,type:'square',  vol:.018, seq:[155.56,0,164.81,0,155.56,0,146.83,138.59],     bass:77.78, bdiv:2,bdur:.70, bvol:.020}
};
var BGM={
  mode:'calm', i:0, nextT:0, tmr:null, armed:false,
  armOnce(){
    if(this.armed) return;
    this.armed=true;
    try{ if(AFx) AFx.ensure(); }catch(e){}
    var self=this;
    if(!this.tmr) this.tmr=setInterval(function(){ self.tick(); },240);
  },
  setMode(m){ if(!PATT[m]||this.mode===m) return; this.mode=m; this.i=0; this.nextT=0; },
  tick(){
    try{ this._tick(); }catch(e){ this.nextT=0; }          /* BGM 异常绝不影响游戏 */
  },
  _tick(){
    if(!this.armed||!AFx||!AFx.on) return;                 /* 尊重原有音效总开关 */
    if(document.hidden){ this.nextT=0; return; }
    var c=null; try{ c=AFx.ctx; }catch(e){}
    if(!c||c.state!=='running'){ this.nextT=0; return; }
    var p=PATT[this.mode], t=c.currentTime;
    if(this.nextT<t) this.nextT=t+.06;                     /* 暂停/切后台后重新对齐 */
    var guard=0;
    while(this.nextT<t+.60 && guard++<16){
      this.beat(p,this.nextT-t);
      this.nextT+=p.step;
    }
  },
  beat(p,t0){
    var f=p.seq[this.i%p.seq.length]; this.i++;
    if(f>0){ try{ AFx.tone(f,t0,p.dur,p.type,p.vol); }catch(e){} }
    if(p.bass&&this.i%p.bdiv===0){ try{ AFx.tone(p.bass,t0,p.bdur,'sine',p.bvol); }catch(e){} }
  }
};
['pointerdown','touchstart','keydown','click'].forEach(function(ev){
  document.addEventListener(ev,function(){ BGM.armOnce(); },{capture:true,passive:true});
});

/* =====================================================================
   C. 心境引擎（只读 S，绝不写任何游戏状态）
   ===================================================================== */
var fx=null, cur='calm', lastSw=0, lastCombo=0, lastMis=0, primed=false;

function moodOf(){
  var St=Snow();
  if(!St||!CFGx||typeof St.hp!=='number'||!CFGx.hp) return 'calm';
  var hp=St.hp/CFGx.hp, dao=St.dao/CFGx.dao, combo=St.combo||0, mis=St.mis||0, C=AUTO_THEME;
  if(hp<=C.crash.hp||dao<=C.crash.dao||mis>=C.crash.mis) return 'crash';
  if(hp< C.storm.hp||dao< C.storm.dao||mis>=C.storm.mis) return 'storm';
  if(combo>=C.bright.combo&&mis===0&&hp>=C.bright.hp&&dao>=C.bright.dao) return 'bright';
  return 'calm';
}
/* 答题即时反馈：连对暖光一闪 / 答错红光一闪（纯装饰层） */
function flash(kind){
  if(!fx) return;
  try{
  fx.classList.remove('mflash-ok','mflash-bad');
  void fx.offsetWidth;                                    /* 重启动画 */
    fx.classList.add(kind==='up'?'mflash-ok':'mflash-bad');
  }catch(e){}
}
function sync(force){
  if(!primed){                                           /* 首帧：静默落位，不弹提示 */
    primed=true;
    var s0=moodOf(); cur=s0;
    root.setAttribute('data-theme',THEME_OF[s0]);
    root.setAttribute('data-mood',s0);
    BGM.setMode(s0);
    var S0=Snow();
    if(S0){ lastCombo=S0.combo||0; lastMis=S0.mis||0; }
    return;
  }
  var St=Snow();
  if(St){
    var c=St.combo||0, m=St.mis||0;
    if(c>lastCombo) flash('up');                          /* 答对 / 连对：暖光一闪 */
    else if(m>lastMis) flash('bad');                      /* 答错 / 连错：红光一闪 */
    lastCombo=c; lastMis=m;
  }
  var m2=moodOf();
  if(m2===cur) return;
  var now=Date.now();
  if(!force&&m2!=='crash'&&now-lastSw<AUTO_THEME.dwell) return; /* 迟滞：防抖动 */
  lastSw=now; cur=m2;
  root.setAttribute('data-theme',THEME_OF[m2]);
  root.setAttribute('data-mood',m2);
  BGM.setMode(m2);
  try{                                                    /* 手机状态栏跟着换色 */
    var mc=document.querySelector('meta[name="theme-color"]');
    if(mc) mc.setAttribute('content',THEME_OF[m2]==='light'?'#eef1f6':'#050a1e');
  }catch(e){}
  toast(LABEL[m2]);
}

/* ---------- 氛围层（纯装饰，pointer-events:none） ---------- */
function mountFx(){
  if(document.getElementById('moodfx')) return;
  fx=document.createElement('div');
  fx.id='moodfx'; fx.setAttribute('aria-hidden','true');
  document.body.appendChild(fx);
}

/* ---------- 挂载：包装 updateHud / render（只加一次回调，原逻辑照常跑） ---------- */
function hook(){
  try{
    if(typeof updateHud==='function'&&updateHud.__moodHook!==1){
      var _old=updateHud;
      var _nw=function(){ var r=_old.apply(this,arguments);   /* 原 HUD 逻辑先跑完 */
        try{ sync(); }catch(err){}                              /* 新增层异常绝不外抛 */
        return r; };
      _nw.__moodHook=1; updateHud=_nw;
    }
  }catch(e){}
  try{
    if(typeof render==='function'&&render.__moodHook!==1){
      var _r=render;
      var _r2=function(){ var r=_r.apply(this,arguments);
        try{ sync(); }catch(err){}
        return r; };
      _r2.__moodHook=1; render=_r2;
    }
  }catch(e){}
  setInterval(function(){ try{ sync(); }catch(e){} },AUTO_THEME.poll);   /* 兜底轮询 */
}

/* =====================================================================
   D. 彩蛋：连续快速点「↺ 重置」5 次 → 「编译器已经麻了」
      单次点击仍走原有 resetRun 确认流程（仅延迟 hold ms 放行）
   ===================================================================== */
var EGG=AUTO_THEME.egg, n=0, lastClick=0, deferT=null;

function realReset(){
  n=0; deferT=null;
  try{
    if(FSMx&&FSMx.is('play','result','break')&&typeof resetRun==='function') resetRun();
  }catch(e){}
}
function memeJingle(){
  if(!AFx||!AFx.on) return;
  try{ AFx.ensure(); }catch(e){}
  var c=null; try{ c=AFx.ctx; }catch(e){}
  if(!c) return;
  /* 编译器宕机音效：下行音阶 + 白噪声 */
  [523.25,466.16,415.30,349.23,277.18,220.00].forEach(function(f,i){
    try{ AFx.tone(f,i*.075,.20,'square',.075); }catch(e){}
  });
  try{ AFx.noise(.05,.45,.07); }catch(e){}
}
function closeMeme(){
  var ovl=document.getElementById('eggOvl');
  if(!ovl) return;
  document.removeEventListener('keydown',escGuard,true);
  if(ovl.parentNode) ovl.parentNode.removeChild(ovl);
}
function escGuard(e){ if(e.key==='Escape'){ e.stopPropagation(); e.preventDefault(); closeMeme(); toast('↺ 本局未重置，继续渡劫'); } }
function showMeme(){
  if(document.getElementById('eggOvl')) return;
  var ovl=document.createElement('div');
  ovl.id='eggOvl'; ovl.setAttribute('role','dialog'); ovl.setAttribute('aria-modal','true');
  ovl.innerHTML=
    '<div class="eggcard">'+
      '<div class="eggface">😵‍💫</div>'+
      '<div class="eggt">反复编译这么多次，编译器已经麻了😵</div>'+
      '<div class="eggs">$ gcc life.c -o future <b>&amp;&amp;</b> 再来一次<br>'+
        '×'+EGG.need+' compilations · <b>0 errors</b>, <b>0 warnings</b>, 1 exhausted compiler</div>'+
      '<button class="eggb" id="eggOK" type="button">行了行了，让编译器缓缓 →</button>'+
      '<div class="eggh">彩蛋仅供玩梗：本局进度、图鉴、成就、存档均未改动</div>'+
    '</div>';
  document.body.appendChild(ovl);
  document.addEventListener('keydown',escGuard,true);
  ovl.addEventListener('click',function(e){
    if(e.target===ovl||e.target.id==='eggOK'){ closeMeme(); toast('↺ 本局未重置，继续渡劫'); }
  });
  var ok=document.getElementById('eggOK'); if(ok) ok.focus({preventScroll:true});
  memeJingle();
}
function mountEgg(){
  var btn=document.getElementById('btnReset'); if(!btn) return;
  /* 用祖先 capture 监听：早于按钮自身的 onclick 触发，可安全拦截本次点击 */
  var host=(btn.closest&&btn.closest('.topbar'))||document;
  host.addEventListener('click',function(e){
    var t=e.target;
    var hit=(t===btn)||(t.closest&&t.closest('#btnReset')===btn);
    if(!hit) return;
    var now=Date.now();
    n=(now-lastClick<=EGG.gap)?n+1:1;
    lastClick=now;
    e.stopPropagation(); e.preventDefault();
    if(deferT){ clearTimeout(deferT); deferT=null; }
    if(n>=EGG.need){ n=0; lastClick=0; showMeme(); return; }   /* 满 5 次：只弹彩蛋，不重置 */
    deferT=setTimeout(realReset,EGG.hold);                      /* 否则照常走原确认框 */
  },true);
}

/* =====================================================================
   E. 启动
   ===================================================================== */
function boot(){
  try{
    root.setAttribute('data-theme','dark');
    root.setAttribute('data-mood','calm');
    mountFx();
    mountEgg();
    hook();
    sync(true);
  }catch(err){ /* 新增层任何异常都不许影响原游戏 */
    try{ console.warn('[AutoTheme] disabled:',err); }catch(e){}
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
</script>

<!-- =====================================================================
     ✅✅ 新增代码块 ④（补丁层 JS）：四处运行时兜底，不动主干逻辑
     ------------------------------------------------------------------
     · P-J1 浅色主题时暂停星空 canvas 的 rAF（原层只把 opacity 设为 0，
            实测仍以 ~60fps 在跑，白白耗电）；切回深色自动恢复；
     · P-J2 「读档续玩」加 try/catch：脏存档/旧格式存档不再抛异常卡死；
     · P-J3 触屏设备把页脚的「1-5 速选 · Enter 继续 · D 翻手册」换成触屏说明；
     · P-J4 窄屏把飘字改到底部吸附，避免盖住 HUD 数值与题干；
     · 全部包在 try/catch 里，整块删除即回到当前线上版本。
     ===================================================================== -->
<script>
(function(){
  'use strict';
  var root=document.documentElement;

  /* P-J1 浅色 = 不需要星屑背景，停掉绘制循环 */
  function idleStars(){
    try{
      if(typeof Stars==='undefined'||!Stars||!Stars.cv||!Stars.cx) return;
      var light=(root.getAttribute('data-theme')==='light');
      var rm=(typeof reducedMotion==='function')&&reducedMotion();
      if(light){
        if(Stars.raf){ cancelAnimationFrame(Stars.raf); Stars.raf=0; }
      }else if(!Stars.raf && !document.hidden && !rm){
        Stars.loop();
      }
    }catch(e){}
  }

  /* P-J2 读档失败兜底：清掉坏档 + 回星庭，而不是留一个抛错的空局 */
  function guardResume(){
    try{
      var rs=document.getElementById('resume');
      if(!rs||rs.__guard===1) return;
      var orig=rs.onclick;
      if(typeof orig!=='function') return;              /* 本轮还没绑定，等下次 */
      rs.__guard=1;
      rs.onclick=function(){
        try{ orig.apply(this,arguments); }
        catch(err){
          try{ if(typeof clearRun==='function') clearRun(); }catch(e2){}
          try{ if(typeof home==='function') home(); }catch(e3){}
          try{ if(typeof pop==='function') pop('存档已失效，已为你回到星庭'); }catch(e4){}
          try{ console.warn('[Patch] resume failed:',err); }catch(e5){}
        }
      };
    }catch(e){}
  }

  /* P-J3 页脚快捷键提示：纯触屏设备显示触屏说明（只替换文案） */
  var isTouch=(function(){
    try{ return !!(window.matchMedia&&matchMedia('(hover:none) and (pointer:coarse)').matches); }
    catch(e){ return false; }
  })();
  function footFix(){
    if(!isTouch) return;
    try{
      var f=document.getElementById('dexLine');
      if(f&&f.textContent.indexOf('1-5 速选')>=0){
        f.textContent=f.textContent
          .replace('1-5 速选 · Enter 继续 · D 翻手册','轻点选项作答 · 下滑看解析 · 顶部按钮翻手册');
      }
    }catch(e){}
  }
  if(isTouch){
    try{
      if(typeof updateFoot==='function'&&updateFoot.__patched!==1){
        var _of=updateFoot;
        var _nf=function(){ try{ _of.apply(this,arguments); }catch(e){} footFix(); };
        _nf.__patched=1; updateFoot=_nf;
      }
    }catch(e){}
    footFix();
  }

  /* P-J4 窄屏：把飘字从 top:74px 搬到底部吸附（只改节点样式，不动 pumpToast 逻辑） */
  var narrow=window.matchMedia?matchMedia('(max-width:719px), (max-height:540px)'):null;
  function toBottom(){
    try{
      if(!narrow||!narrow.matches) return;
      var ds=document.querySelectorAll('.pop');
      for(var i=0;i<ds.length;i++){
        var d=ds[i]; if(d.__snk===1) continue; d.__snk=1;
        var t=parseFloat(d.style.top)||74;
        d.style.top='auto'; d.style.marginTop='0';
        d.style.bottom=(78+(t-74))+'px';   /* 74→78px, 116→120px, 158→162px，始终高于 sticky 的「继续」按钮 */
      }
    }catch(e){}
  }
  try{
    if(typeof pumpToast==='function'&&pumpToast.__snk!==1){
      var _pt=pumpToast;
      var _np=function(){ _pt.apply(this,arguments); toBottom(); };
      _np.__snk=1; pumpToast=_np;
    }
  }catch(e){}

  function tick(){ try{ idleStars(); }catch(e){} try{ guardResume(); }catch(e){} try{ toBottom(); }catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',tick);
  setInterval(tick,500);
  tick();
})();
</script>

<!-- =====================================================================
     ✅✅ 新增代码块 ⑤（音效层）：点击音换成「星光音」
     ------------------------------------------------------------------
     · 原版的普通按钮点击音是 AudioFX.click() —— 760Hz→520Hz 单音 60ms，
       偏「滴」的提示音；这里只在运行时替换掉这一个方法的实现，
       所有调用点（顶栏按钮、浮层、抽签、中性结算）自动换成星光音；
     · 星光音 = 五声音阶随机取一音 + 上滑主音 + 两个高次泛音，
       和浅色心境的 BGM 同一套音阶，听起来像星屑落下来；
     · 只复用原有 AudioFX.ensure/tone 原语，不新建 AudioContext，
       自动尊重 🔊/🔇 总开关与首次手势解锁；整块删除即回到原来的「滴」。
     ===================================================================== -->
<script>
(function(){
  'use strict';
  var TW={
    /* C 宫五声（C-D-E-G-A）两个八度，和 bright 心境的 BGM 音阶一致 */
    scale:[523.25,587.33,659.25,783.99,880.00,1046.50,1174.66,1318.51,1567.98,1760.00],
    vol:1.00,      /* 总音量倍率：想更轻就调小，0.6 ≈ 比原版「滴」还轻 */
    dur:0.30,      /* 主音衰减长度（秒）*/
    gap:36,        /* 两次点击音的最小间隔 ms，防连点叠成一片噪音 */
    on:true        /* 本层独立开关：设 false 立刻回到原版点击音 */
  };
  try{ window.STAR_CLICK=TW; }catch(e){}

  var lastAt=0, origClick=null;

  function twinkle(){
    try{
      if(typeof AudioFX==='undefined'||!AudioFX.on) return;      /* 总开关关着就完全静音 */
      var c=AudioFX.ensure?AudioFX.ensure():null;                 /* 复用原有 ctx / 手势解锁 */
      if(!c||typeof AudioFX.tone!=='function') return;
      /* 后台标签页里 ctx 常被挂起，此时排下去的音符会攒到恢复的一瞬间一起炸出来，
         所以页面不可见时直接不出声（原版单音 click 也有同样风险，这里顺手挡掉） */
      if(document.hidden) return;
      var now=Date.now();
      if(now-lastAt<TW.gap) return; lastAt=now;
      var f=TW.scale[(Math.random()*TW.scale.length)|0], v=TW.vol;
      AudioFX.tone(f,          0,    TW.dur,     'sine', 0.050*v, f*1.19);  /* 上滑主音 */
      AudioFX.tone(f*2,        0.035, TW.dur*0.66,'sine', 0.022*v);         /* 八度泛音 */
      AudioFX.tone(f*3.01,     0.070, TW.dur*0.42,'sine', 0.011*v);         /* 微失谐 → 星屑感 */
    }catch(e){}
  }

  try{
    if(typeof AudioFX!=='undefined'&&AudioFX.click&&AudioFX.click.__star!==1){
      origClick=AudioFX.click;                    /* 保留原方法，STAR_CLICK.on=false 时用它发原声 */
      var sw=function(){
        if(TW.on){ twinkle(); return; }
        if(typeof origClick==='function'){ try{ origClick.call(AudioFX); }catch(e3){} }
      };
      sw.__star=1; AudioFX.click=sw;
    }
  }catch(e){}
})();
</script>

<!-- =====================================================================
     ✅✅ 新增代码块 ⑥-JS（特效层）：点击「星环炸裂」
     ------------------------------------------------------------------
     · 只新增 2 个监听：window 捕获阶段 click + visibilitychange 清理；
     · 不包装任何原有函数、不调用 AudioFX、不读不写任何存档键；
     · 热区/彩蛋/滚动完全不受影响（容器 pointer-events:none）；
     · 复用原版 reducedMotion()：开了「减弱动效」就不画；
     · 并发硬上限 + 定时回收，切后台立刻清空，节点不会堆积；
     · 整块删除后游戏照原样运行（零耦合）。
     · 控制台可调：STAR_RING.on=false 关掉，.shards/.dur/.r/.spread/.max 改手感。
     ===================================================================== -->
<script>
(function(){
'use strict';
var SR={ on:true, shards:9, dur:.52, r:82, spread:56, max:5 };
try{ window.STAR_RING=SR; }catch(e){}
var host=null, GL=['✦','✧','⋆','✩'], curR=82;
var SEL='button,.chip,.tab,.next,.close,.dx,.nb,.hist .h';
var SKIP='.chip.passive,.chip.lv,#buffbar .chip';

function mount(){
  if(host) return;
  var d=document.createElement('div'); d.id='sring';
  try{ document.body.appendChild(d); host=d; }catch(e){ host=null; }
}
function one(cls,x,y,dur,dx,dy,txt){
  var n=document.createElement('i'); n.className=cls;
  n.style.setProperty('--x',x+'px'); n.style.setProperty('--y',y+'px');
  n.style.setProperty('--sd',dur.toFixed(3)+'s');
  if(dx!==undefined){ n.style.setProperty('--dx',dx+'px'); n.style.setProperty('--dy',dy+'px'); }
  if(txt) n.textContent=txt; else n.style.setProperty('--sr',curR+'px');
  host.appendChild(n); return n;
}
function spawn(x,y){
  try{
    if(!SR.on) return;
    if(typeof reducedMotion==='function' && reducedMotion()) return;
    if(document.hidden) return;
    mount(); if(!host) return;
    var D=Math.min(.9,Math.max(.12,SR.dur)), R=Math.min(320,Math.max(10,SR.r));
    var S=Math.min(260,Math.max(6,SR.spread)), K=Math.min(16,Math.max(0,SR.shards|0));
    if(!isFinite(x)||!isFinite(y)) return;
    curR=R;
    var made=[ one('srf',x,y,D), one('srh',x,y,D), one('srh e',x,y,D*1.3) ], i;
    for(i=0;i<K;i++){
      var a=Math.PI*2*i/K+Math.random()*.6, d=S*(.55+Math.random()*.75), du=D*(.8+Math.random()*.5);
      made.push(one(i%2?'srg':'srd',x,y,du,(Math.cos(a)*d).toFixed(1),(Math.sin(a)*d).toFixed(1),
                     i%2?GL[(Math.random()*GL.length)|0]:null));
    }
    while(host.childElementCount>SR.max*14){ host.removeChild(host.firstElementChild); }
    setTimeout(function(){ for(var j=0;j<made.length;j++){ var n=made[j];
      if(n.parentNode) n.parentNode.removeChild(n); } }, D*1400+340);
  }catch(err){}
}
function at(e){
  try{
    var t=e.target;
    if(!t||!t.closest) return;
    var el=t.closest(SEL); if(!el) return;
    if(t.closest(SKIP)) return;
    var x=e.clientX, y=e.clientY;
    if(!x&&!y){ var r=el.getBoundingClientRect();
      if(!r.width&&!r.height) return;
      x=r.left+r.width/2; y=r.top+r.height/2; }
    spawn(x,y);
  }catch(err){}
}
function bind(){ try{ window.addEventListener('click',at,true); }catch(e){} }
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind); else bind();
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&host){ while(host.firstChild) host.removeChild(host.firstChild); }
},true);
})();
</script>
</body>
</html>
